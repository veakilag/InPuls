name: Apply active Tape latency

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/agent-low-latency-active-tape-v1.yml
      - tools/apply-low-latency-active-tape-v1.py

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/low-latency-active-tape-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/low-latency-active-tape-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply latency fast path
        run: python tools/apply-low-latency-active-tape-v1.py

      - name: Check runtime syntax
        run: |
          node --check orderbook-worker.js
          node --check orderbook.js

      - name: Run full tests
        run: npm test

      - name: Commit verified runtime
        run: |
          rm -f tools/apply-low-latency-active-tape-v1.py .github/workflows/agent-low-latency-active-tape-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Speed active Tape delivery" -m "Reduce the selected symbol Tape micro-batch to 4 ms, preserve 25 ms background batching, and align the legacy fallback."
          git push origin HEAD:agent/low-latency-active-tape-v1
