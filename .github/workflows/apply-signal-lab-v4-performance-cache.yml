name: Publish Signal Lab V4 performance cache bust

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v4-performance-cache-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply cache bust
        run: python scripts/patch-signal-lab-v4-performance-cache.py

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: npm test

      - name: Commit clean cache-busted release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-signal-lab-v4-performance-cache.yml scripts/patch-signal-lab-v4-performance-cache.py
          git add owner-signal-lab-v3.html owner-signal-lab-v3.js signal-lab-v3-collector.js
          git commit -m "Publish Signal Lab V4 performance cache bust [signal-lab-v4-performance-cache-applied]"
          git push origin HEAD:main
