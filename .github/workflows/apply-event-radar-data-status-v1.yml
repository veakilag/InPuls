name: Apply Event Radar data status v1

on:
  push:
    branches:
      - fix/event-radar-data-status-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply isolated Event Radar diagnostics
        run: node scripts/apply-event-radar-data-status-v1.mjs

      - name: Syntax checks
        run: |
          node --check event-radar-beta.js
          node --check scripts/apply-event-radar-data-status-v1.mjs

      - name: Event Radar focused tests
        run: node --test test-event-radar-beta-v1.mjs

      - name: Full test suite
        run: npm test

      - name: Diff validation
        run: git diff --check

      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add event-radar-beta.js event-radar-beta.css test-event-radar-beta-v1.mjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "fix: show Event Radar feed status"
            git push
          fi
