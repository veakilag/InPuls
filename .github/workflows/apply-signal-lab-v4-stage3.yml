name: Validate Signal Lab V4 stage three

on:
  push:
    branches:
      - agent/signal-lab-v4-cascade-state-machine

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v4-stage3-validated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out cascade branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v4-cascade-state-machine
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: npm test

      - name: Remove temporary validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-signal-lab-v4-stage3.yml
          git commit -m "Validate Signal Lab V4 cascade state machine [signal-lab-v4-stage3-validated]"
          git push origin HEAD:agent/signal-lab-v4-cascade-state-machine
