name: Runtime smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/raw-series-execution-candles-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply raw series patch
        shell: bash
        run: |
          cat tools/raw-series-v1/chunk*.pyfrag > /tmp/apply-raw-series-v1.py
          python /tmp/apply-raw-series-v1.py

      - name: Check runtime syntax
        run: |
          node --check orderbook.js
          node --check orderbook-worker.js
          node --check orderbook-flow-workspace.js

      - name: Run targeted raw series tests
        shell: bash
        run: |
          set +e
          node --test test-raw-series-execution-candles-v1.mjs > /tmp/raw-series-test.log 2>&1
          status=$?
          cat /tmp/raw-series-test.log
          exit $status

      - name: Run full tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          status=$?
          tail -n 400 /tmp/npm-test.log
          exit $status

      - name: Start local static server
        run: |
          python3 -m http.server 4173 > /tmp/inpuls-http.log 2>&1 &
          echo $! > /tmp/inpuls-http.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/inpuls-http.log
          exit 1

      - name: Local browser startup smoke
        env:
          CHROME_BIN: google-chrome
        run: node scripts/browser-runtime-smoke.mjs "http://127.0.0.1:4173/?smoke=${GITHUB_SHA}"

      - name: Local rescue path smoke
        env:
          CHROME_BIN: google-chrome
        run: node scripts/browser-runtime-smoke.mjs "http://127.0.0.1:4173/rescue-26-94.html?smoke=${GITHUB_SHA}"

      - name: Commit verified runtime
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/runtime-smoke.yml
          rm -rf tools/raw-series-v1
          rm -f .github/workflows/apply-raw-series-execution-candles-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use raw executions for Tape series"
          git push origin HEAD:agent/raw-series-execution-candles-v1

      - name: Production browser startup smoke
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: google-chrome
        run: node scripts/browser-runtime-smoke.mjs "https://veakilag.github.io/InPuls/?smoke=${GITHUB_SHA}"

      - name: Production rescue path smoke
        if: github.event_name != 'pull_request'
        env:
          CHROME_BIN: google-chrome
        run: node scripts/browser-runtime-smoke.mjs "https://veakilag.github.io/InPuls/rescue-26-94.html?smoke=${GITHUB_SHA}"
