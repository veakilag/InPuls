name: Runtime smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out raw series branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/raw-series-execution-candles-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Finalize SERIES state fields
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker_path = Path('orderbook-worker.js')
          worker = worker_path.read_text(encoding='utf-8')
          old = '''    this.seriesRawStreak = 0;
              this.seriesGapCount = 0;
              this.seriesReady = false;
              this.seriesResetPending = true;
              this.seriesLastReason = "startup";'''
          new = '''    this.seriesRawStreak = 0;
              this.seriesRawHealthy = false;
              this.seriesReplacePending = true;
              this.seriesGapCount = 0;
              this.seriesOutOfOrderCount = 0;
              this.seriesLastReason = "startup";'''
          if worker.count(old) != 1:
              raise SystemExit(f'expected one SERIES constructor block, found {worker.count(old)}')
          worker_path.write_text(worker.replace(old, new, 1), encoding='utf-8')

          test_path = Path('test-raw-series-execution-candles-v1.mjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = '  assert.match(worker, /trade\\?\\.source !== "raw"/);\n'
          addition = (
              anchor
              + '  assert.match(worker, /this\\.seriesRawHealthy = false/);\n'
              + '  assert.match(worker, /this\\.seriesReplacePending = true/);\n'
              + '  assert.match(worker, /this\\.seriesOutOfOrderCount = 0/);\n'
              + '  assert.doesNotMatch(worker, /this\\.seriesReady = false/);\n'
          )
          if test.count(anchor) != 1:
              raise SystemExit(f'expected one SERIES test anchor, found {test.count(anchor)}')
          test_path.write_text(test.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Check runtime syntax
        run: |
          node --check orderbook.js
          node --check orderbook-worker.js
          node --check orderbook-flow-workspace.js

      - name: Run targeted raw series tests
        run: node --test test-raw-series-execution-candles-v1.mjs

      - name: Run full tests
        run: npm test

      - name: Start local static server
        run: |
          python3 -m http.server 4173 > /tmp/inpuls-http.log 2>&1 &
          echo $! > /tmp/inpuls-http.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/inpuls-http.log
          exit 1

      - name: Local browser startup smoke
        env:
          CHROME_BIN: google-chrome
        run: node scripts/browser-runtime-smoke.mjs "http://127.0.0.1:4173/?smoke=${GITHUB_SHA}"

      - name: Local rescue path smoke
        env:
          CHROME_BIN: google-chrome
        run: node scripts/browser-runtime-smoke.mjs "http://127.0.0.1:4173/rescue-26-94.html?smoke=${GITHUB_SHA}"

      - name: Commit clean verified runtime
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/runtime-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finalize raw Tape series state"
          git push origin HEAD:agent/raw-series-execution-candles-v1
