name: Apply Tape stable pixels follow-up

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: github.head_ref == 'agent/tape-stable-pixels-cluster-lane-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused runtime changes
        run: python .github/scripts/apply-tape-stable-pixels-cluster-lane-v1.py
      - name: Refresh intentional visual assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test-orderbook-visual-priority.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              r'assert.match(flow, /const bodyWidth = Math\.max\(2, Math\.min\(8, columnWidth \* \.16\)\)/);': r'assert.match(flow, /const bodyWidth = candleBodyWidth/);',
              r'assert.match(orderbook, /const y = item\.row\.y;/);': r'assert.match(orderbook, /const y = snapTapeCoordinate\(item\.row\.y, dpr\)/);',
              r'assert.match(orderbook, /const pathY = pathItem\.row\.y;/);': r'assert.match(orderbook, /const pathY = snapTapeCoordinate\(pathItem\.row\.y, dpr\)/);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'visual assertion anchor not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check orderbook-tape-layout.js
          node --check app.js
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-tape-stable-pixels-cluster-lane-v1.py
          rm -f .github/workflows/apply-tape-stable-pixels-cluster-lane-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Tape and separate footprint candle lane"
          git push origin HEAD:${{ github.head_ref }}
