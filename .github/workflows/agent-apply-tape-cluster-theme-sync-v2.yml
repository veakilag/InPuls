name: Apply Tape cluster theme sync v2

on:
  push:
    branches:
      - agent/fix-tape-cluster-theme-sync-v2
    paths:
      - .github/workflows/agent-apply-tape-cluster-theme-sync-v2.yml
      - tools/apply-tape-cluster-theme-sync-v2.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run runtime sync fixer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fixer branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-tape-cluster-theme-sync-v2
          fetch-depth: 0

      - name: Apply targeted runtime patch
        run: python tools/apply-tape-cluster-theme-sync-v2.py

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check canvas-comfort-preview.js

      - name: Run complete test suite
        run: npm test

      - name: Commit tested runtime patch
        run: |
          git config user.name "InPuls CI Fixer"
          git config user.email "actions@users.noreply.github.com"
          git add app.js orderbook.js orderbook-flow-workspace.js index.html sw.js test-footprint-poc-second-preview-v1.mjs test-comfort-slider-smooth-v1.mjs
          git add -u
          git commit -m "Fix Tape, cluster, theme, and clock synchronization"
          git push origin HEAD:agent/fix-tape-cluster-theme-sync-v2
