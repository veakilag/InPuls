name: Apply Signal Lab V3 four-pattern filter

on:
  push:
    branches:
      - agent/signal-lab-v3-four-pattern-filter

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[four-pattern-filter-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v3-four-pattern-filter
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply four-pattern filter
        run: bash scripts/apply-signal-lab-v3-four-pattern-filter.sh

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run regression tests
        run: npm test

      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-signal-lab-v3-four-pattern-filter.yml scripts/apply-signal-lab-v3-four-pattern-filter.sh
          git add signal-lab-v3-candidates.js signal-lab-v3-collector.js signal-lab-v3-explainer.js owner-signal-lab-v3.js owner-signal-lab-v3.html test/signal-lab-v3.test.js test/signal-lab-v3-evidence.test.js test/signal-lab-v3-collector.test.js docs/signal-lab-v3-four-pattern-filter.md
          git commit -m "Restrict Signal Lab V3 to four patterns [four-pattern-filter-applied]"
          git push origin HEAD:agent/signal-lab-v3-four-pattern-filter
