name: Apply smooth chart restoration

on:
  push:
    branches:
      - perf/restore-smooth-charts-v1

permissions:
  contents: write

concurrency:
  group: apply-smooth-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/restore-smooth-charts-v1
          fetch-depth: 0

      - name: Apply scoped chart patch
        run: python3 scripts/apply-smooth-charts-v1.py

      - name: Run focused checks
        run: |
          node --check app.js
          node --check chart.js
          node --test test-smooth-chart-first-v1.mjs

      - name: Commit patched runtime
        run: |
          rm .github/workflows/apply-smooth-charts-v1.yml
          rm scripts/apply-smooth-charts-v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: restore smooth live chart rendering"
          git push origin HEAD:perf/restore-smooth-charts-v1
