name: Fix Flow Workspace render loop

on:
  push:
    branches:
      - agent/flow-workspace-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop self-triggered redraws
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path("orderbook-flow-workspace.js")
          test_path = Path("test-orderbook-flow-workspace.mjs")
          workflow_path = Path(".github/workflows/fix-flow-workspace-render-loop.yml")

          source = module_path.read_text(encoding="utf-8")

          old_observer = '''  const observer = new MutationObserver(requestDraw);
            observer.observe(card, { childList: true, subtree: true, characterData: true });
            state.observer = observer;'''
          new_observer = '''  const bookRows = card.querySelector(".orderbook-rows");
            const observer = new MutationObserver(requestDraw);
            if (bookRows) {
              observer.observe(bookRows, {
                childList: true,
                subtree: true,
                characterData: true,
              });
            }
            state.observer = observer;'''
          count = source.count(old_observer)
          if count != 1:
              raise RuntimeError(f"Expected one card observer block, got {count}")
          source = source.replace(old_observer, new_observer, 1)

          old_count = '''  const visibleCount = visibleFlowCount(trades, window.startTime, window.endTime);
            state.count.textContent = `${visibleCount} trades`;
            state.flowCount.textContent = `${visibleCount} trades`;'''
          new_count = '''  const visibleCount = visibleFlowCount(trades, window.startTime, window.endTime);
            const countText = `${visibleCount} trades`;
            if (state.count.textContent !== countText) state.count.textContent = countText;
            if (state.flowCount.textContent !== countText) state.flowCount.textContent = countText;'''
          count = source.count(old_count)
          if count != 1:
              raise RuntimeError(f"Expected one count update block, got {count}")
          source = source.replace(old_count, new_count, 1)

          module_path.write_text(source, encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          import_anchor = 'import test from "node:test";'
          if tests.count(import_anchor) != 1:
              raise RuntimeError("Missing unique test import anchor")
          tests = tests.replace(
              import_anchor,
              import_anchor + '\nimport { readFileSync } from "node:fs";',
              1,
          )

          test_block = r'''

          test("Flow Workspace redraw observer cannot trigger itself", () => {
            const source = readFileSync(
              new URL("./orderbook-flow-workspace.js", import.meta.url),
              "utf8",
            );
            assert.match(source, /observer\.observe\(bookRows,/);
            assert.doesNotMatch(source, /observer\.observe\(card,/);
            assert.match(
              source,
              /if \(state\.count\.textContent !== countText\) state\.count\.textContent = countText/,
            );
            assert.match(
              source,
              /if \(state\.flowCount\.textContent !== countText\) state\.flowCount\.textContent = countText/,
            );
          });
          '''
          if "Flow Workspace redraw observer cannot trigger itself" in tests:
              raise RuntimeError("Render loop test already exists")
          test_path.write_text(tests.rstrip() + test_block, encoding="utf-8")

          workflow_path.unlink(missing_ok=True)
          PY

      - name: Validate JavaScript
        run: |
          node --check orderbook-flow-workspace.js
          node --check test-orderbook-flow-workspace.mjs

      - name: Run orderbook tests
        run: node --test test-orderbook-*.mjs

      - name: Commit render loop fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Stop Flow Workspace render loop"
          git push
