name: Apply Signal Lab V3 legacy evidence state

on:
  push:
    branches:
      - agent/signal-lab-v3-evidence-replay

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[legacy-evidence-state-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v3-evidence-replay
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply legacy evidence state
        run: node scripts/patch-signal-lab-v3-legacy-evidence-state.mjs

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: npm test

      - name: Commit final state and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/signal-lab-v3-legacy-evidence-state.yml scripts/patch-signal-lab-v3-legacy-evidence-state.mjs
          git add signal-lab-v3-replay-ui.js test/signal-lab-v3-evidence.test.js
          git commit -m "Explain missing evidence for legacy episodes [legacy-evidence-state-applied]"
          git push origin HEAD:agent/signal-lab-v3-evidence-replay
