name: Apply Signal Lab V5.2 cross-bar opposite preservation

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v5-2-crossbar-opposite-preservation.py
      - .github/workflows/apply-signal-lab-v5-2-crossbar-opposite-preservation.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Apply V5.2 cross-bar preservation
        run: python3 scripts/apply-signal-lab-v5-2-crossbar-opposite-preservation.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v5-2-crossbar-opposite-preservation.py
          rm -f .github/workflows/apply-signal-lab-v5-2-crossbar-opposite-preservation.yml

      - name: Validate syntax and focused V5.2 regression
        run: |
          node --check signal-lab-v7-structural-extremes.js
          node --check signal-lab-v7-multi-timeframe-levels.js
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          git diff --check
          node --test test/signal-lab-v7-structural-extremes-v3.test.js

      - name: Run structural regression set
        run: |
          node --test \
            test/signal-lab-v7-structural-extremes.test.js \
            test/signal-lab-v7-structural-extremes-isolation.test.js \
            test/signal-lab-v7-structural-extremes-v3.test.js \
            test/signal-lab-v7-tradable-structure-v5.test.js \
            test/signal-lab-v7-multi-timeframe-levels.test.js

      - name: Run complete regression suite with diagnostic annotation
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/v5-full-suite.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            details=$(grep -E "not ok|AssertionError|ERR_ASSERTION|actual:|expected:|failureType:|error:" /tmp/v5-full-suite.log | tail -n 24 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            if [ -z "$details" ]; then
              details=$(tail -n 40 /tmp/v5-full-suite.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            fi
            echo "::error title=V5.2 full regression failure::$details"
            exit "$rc"
          fi

      - name: Commit verified V5.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve cross-bar opposite pivots across structural continuation V5.2"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
