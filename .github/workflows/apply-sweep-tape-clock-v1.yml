name: Apply Sweep tape and clock fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/sweep-tape-clock-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align Sweep patch transformers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_sweep_tape_clock_v1.py")
          text = path.read_text(encoding="utf-8")

          start_marker = "text = text.replace(\n    '''      drawAggregatePriceRange("
          end_marker = '    raise RuntimeError("aggregate anchors: expected two render branches")'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f"anchor block boundaries not found: start={start}, end={end}")
          end += len(end_marker)
          anchor_replacement = r'''text, unlabelled_anchor_count = re.subn(
              r"(?m)^(\s{6})drawAggregatePriceRange\(\n(\s{8})context,\n(\s{8})state\.priceViewport,",
              lambda match: (
                  f"{match.group(1)}drawAggregateAnchor(context, baseX, x, y, stroke, openAggregate);\n"
                  f"{match.group(1)}drawAggregatePriceRange(\n"
                  f"{match.group(2)}context,\n"
                  f"{match.group(3)}state.priceViewport,"
              ),
              text,
              count=1,
          )
          text, labelled_anchor_count = re.subn(
              r"(?m)^(\s{4})drawAggregatePriceRange\(\n(\s{6})context,\n(\s{6})state\.priceViewport,",
              lambda match: (
                  f"{match.group(1)}drawAggregateAnchor(context, baseX, x, y, stroke, openAggregate);\n"
                  f"{match.group(1)}drawAggregatePriceRange(\n"
                  f"{match.group(2)}context,\n"
                  f"{match.group(3)}state.priceViewport,"
              ),
              text,
              count=1,
          )
          if (unlabelled_anchor_count, labelled_anchor_count) != (1, 1):
              raise RuntimeError(
                  f"aggregate anchors: expected (1, 1), got "
                  f"({unlabelled_anchor_count}, {labelled_anchor_count})"
              )'''
          text = text[:start] + anchor_replacement + text[end:]

          base_font_block = '''footprint = replace_once(
              footprint,
              '  state.context.font = "800 7px Inter, system-ui, sans-serif";',
              '  state.context.font = "700 7px Arial, sans-serif";',
              "footprint base font",
          )
          '''
          restore_font_block = '''footprint = replace_once(
              footprint,
              '        state.context.font = "800 7px Inter, system-ui, sans-serif";',
              '        state.context.font = "700 7px Arial, sans-serif";',
              "footprint font restore",
          )
          '''
          for label, block in (("base", base_font_block), ("restore", restore_font_block)):
              if block not in text:
                  raise SystemExit(f"footprint {label} font block not found")
              text = text.replace(block, "", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply Sweep tape implementation
        run: python tools/apply_sweep_tape_clock_v1.py

      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check app.js
          node --check orderbook-worker.js

      - name: Full test suite
        run: npm test

      - name: Remove patch scaffolding
        run: |
          rm -f tools/apply_sweep_tape_clock_v1.py
          rm -f .github/workflows/apply-sweep-tape-clock-v1.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Sweep tape mode and synchronize timeline"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
