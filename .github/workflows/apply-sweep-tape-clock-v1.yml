name: Apply Sweep tape and clock fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/sweep-tape-clock-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align Sweep patch transformers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_sweep_tape_clock_v1.py")
          text = path.read_text(encoding="utf-8")

          start_marker = "text = text.replace(\n    '''      drawAggregatePriceRange("
          end_marker = '    raise RuntimeError("aggregate anchors: expected two render branches")'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f"anchor block boundaries not found: start={start}, end={end}")
          end += len(end_marker)
          anchor_replacement = r'''text, unlabelled_anchor_count = re.subn(
              r"(?m)^(\s{6})drawAggregatePriceRange\(\n(\s{8})context,\n(\s{8})state\.priceViewport,",
              lambda match: (
                  f"{match.group(1)}drawAggregateAnchor(context, baseX, x, y, stroke, openAggregate);\n"
                  f"{match.group(1)}drawAggregatePriceRange(\n"
                  f"{match.group(2)}context,\n"
                  f"{match.group(3)}state.priceViewport,"
              ),
              text,
              count=1,
          )
          text, labelled_anchor_count = re.subn(
              r"(?m)^(\s{4})drawAggregatePriceRange\(\n(\s{6})context,\n(\s{6})state\.priceViewport,",
              lambda match: (
                  f"{match.group(1)}drawAggregateAnchor(context, baseX, x, y, stroke, openAggregate);\n"
                  f"{match.group(1)}drawAggregatePriceRange(\n"
                  f"{match.group(2)}context,\n"
                  f"{match.group(3)}state.priceViewport,"
              ),
              text,
              count=1,
          )
          if (unlabelled_anchor_count, labelled_anchor_count) != (1, 1):
              raise RuntimeError(
                  f"aggregate anchors: expected (1, 1), got "
                  f"({unlabelled_anchor_count}, {labelled_anchor_count})"
              )'''
          text = text[:start] + anchor_replacement + text[end:]

          base_font_block = '''footprint = replace_once(
              footprint,
              '  state.context.font = "800 7px Inter, system-ui, sans-serif";',
              '  state.context.font = "700 7px Arial, sans-serif";',
              "footprint base font",
          )
          '''
          restore_font_block = '''footprint = replace_once(
              footprint,
              '        state.context.font = "800 7px Inter, system-ui, sans-serif";',
              '        state.context.font = "700 7px Arial, sans-serif";',
              "footprint font restore",
          )
          '''
          for label, block in (("base", base_font_block), ("restore", restore_font_block)):
              if block not in text:
                  raise SystemExit(f"footprint {label} font block not found")
              text = text.replace(block, "", 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply Sweep tape implementation
        run: python tools/apply_sweep_tape_clock_v1.py

      - name: Align test contracts with RAW, AGG and SERIES
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          agg_range = Path("test-agg-range-rx-fix-v1.mjs")
          replace_once(
              agg_range,
              '  assert.match(runtime, /projectTapePrice\\(viewport, minimum\\)/);\n  assert.match(runtime, /projectTapePrice\\(viewport, maximum\\)/);',
              '  assert.match(runtime, /projectTapePrice\\(viewport, visibleMinimum\\)/);\n  assert.match(runtime, /projectTapePrice\\(viewport, visibleMaximum\\)/);',
              "clipped AGG range assertions",
          )

          core = Path("test-orderbook-tape-v2-core.mjs")
          replace_once(
              core,
              '''test("Tape keeps RAW default and AGG explicit", () => {
  assert.match(orderbook, /mode: localStorage\\.getItem\\(TAPE_MODE_KEY\\) === "agg" \\? "agg" : "raw"/);
  assert.match(orderbook, /button\\.textContent = aggregated/);''',
              '''test("Tape keeps RAW default and AGG/SERIES explicit", () => {
  assert.match(orderbook, /const savedMode = localStorage\\.getItem\\(TAPE_MODE_KEY\\)/);
  assert.match(orderbook, /mode: savedMode === "agg" \\|\\| savedMode === "sweep" \\? savedMode : "raw"/);
  assert.match(orderbook, /button\\.textContent = mode === "agg" \\? "AGG" : mode === "sweep" \\? "СЕРИЯ" : "RAW"/);''',
              "three-mode core assertions",
          )

          sealed = Path("test-sealed-agg-round-levels-v1.mjs")
          replace_once(
              sealed,
              '''test("Tape UI keeps zero-ms RAW/AGG and restores the marker threshold", () => {''',
              '''test("Tape UI keeps zero-ms AGG, adds SERIES and restores the marker threshold", () => {''',
              "sealed test title",
          )
          replace_once(
              sealed,
              '  assert.match(orderbook, /button\\.textContent = aggregated \\? "AGG" : "RAW"/);',
              '  assert.match(orderbook, /button\\.textContent = mode === "agg" \\? "AGG" : mode === "sweep" \\? "СЕРИЯ" : "RAW"/);',
              "sealed three-mode assertion",
          )

          lifecycle = Path("test-tape-cluster-lifecycle-v1.mjs")
          replace_once(
              lifecycle,
              '''test("runtime ships zero-ms RAW/AGG control, synchronized canvas and density age toggle", () => {''',
              '''test("runtime ships zero-ms RAW/AGG/SERIES control, synchronized canvas and density age toggle", () => {''',
              "lifecycle test title",
          )
          replace_once(
              lifecycle,
              '  assert.match(runtime, /button\\.textContent = aggregated \\? "AGG" : "RAW"/);',
              '  assert.match(runtime, /button\\.textContent = mode === "agg" \\? "AGG" : mode === "sweep" \\? "СЕРИЯ" : "RAW"/);',
              "lifecycle three-mode assertion",
          )
          PY

      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check app.js
          node --check orderbook-worker.js

      - name: Full test suite
        run: npm test

      - name: Remove patch scaffolding
        run: |
          rm -f tools/apply_sweep_tape_clock_v1.py
          rm -f .github/workflows/apply-sweep-tape-clock-v1.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Sweep tape mode and synchronize timeline"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
