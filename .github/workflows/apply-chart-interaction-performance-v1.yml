name: Apply chart interaction performance v1

on:
  push:
    branches:
      - agent/chart-interaction-performance-v1
    paths:
      - .github/workflows/apply-chart-interaction-performance-v1.yml
      - scripts/apply-chart-interaction-performance.py
      - scripts/finalize-chart-performance-release.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out performance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/chart-interaction-performance-v1
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply chart performance changes
        run: |
          python3 scripts/apply-chart-interaction-performance.py
          python3 scripts/finalize-chart-performance-release.py

      - name: Validate syntax and patch integrity
        run: |
          node --check chart.js
          node --check app.js
          node --check signal-lab-chart-modal.js
          node --check owner-signal-lab-v3.js
          git diff --check

      - name: Run complete test suite
        id: tests
        shell: bash
        run: |
          set +e
          npm test > action-test-output.txt 2>&1
          status=$?
          cat action-test-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit test diagnostics when failing
        if: steps.tests.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action-test-output.txt
          git commit -m "Capture chart performance test failure"
          git push origin HEAD:agent/chart-interaction-performance-v1
          exit 1

      - name: Commit verified performance fix
        if: steps.tests.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-chart-interaction-performance-v1.yml
          git rm scripts/apply-chart-interaction-performance.py
          git rm scripts/finalize-chart-performance-release.py
          if git ls-files --error-unmatch action-test-output.txt >/dev/null 2>&1; then
            git rm -f action-test-output.txt
          else
            rm -f action-test-output.txt
          fi
          git add -A
          git commit -m "Make chart navigation smooth with dense extreme rays"
          git push origin HEAD:agent/chart-interaction-performance-v1
