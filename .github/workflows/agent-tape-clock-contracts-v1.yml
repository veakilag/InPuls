name: Apply Tape clock contracts

on:
  push:
    branches:
      - agent/tape-now-live-contracts
    paths:
      - .github/workflows/agent-tape-clock-contracts-v1.yml
      - tools/apply-tape-clock-contracts-v1.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tape-now-live-contracts
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply focused patch
        run: python tools/apply-tape-clock-contracts-v1.py

      - name: Check runtime syntax
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js

      - name: Run full tests
        run: npm test

      - name: Commit verified runtime
        run: |
          rm -f tools/apply-tape-clock-contracts-v1.py .github/workflows/agent-tape-clock-contracts-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Tape and footprint clocks" -m "Separate execution, display and interval time; stabilize footprint price buckets and seed the live candle at the exact boundary."
          git push origin HEAD:agent/tape-now-live-contracts

# Trigger focused verification.
