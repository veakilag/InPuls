name: Finalize live comfort preview

on:
  push:
    branches:
      - fix/live-comfort-preview-v1

permissions:
  contents: write

concurrency:
  group: finalize-live-comfort-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/live-comfort-preview-v1
          fetch-depth: 0

      - name: Apply final cache-key patch
        run: python3 scripts/finalize-live-comfort-preview.py

      - name: Commit final patch
        run: |
          rm .github/workflows/finalize-live-comfort-preview.yml
          rm scripts/finalize-live-comfort-preview.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: ship live comfort preview build"
          git push origin HEAD:fix/live-comfort-preview-v1
