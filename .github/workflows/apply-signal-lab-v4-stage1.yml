name: Apply Signal Lab V4 stage one

on:
  push:
    branches:
      - agent/signal-lab-v4-extremes-orderflow-replay

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v4-stage1-applied]') && !contains(github.event.head_commit.message, '[signal-lab-v4-patch-log]') && !contains(github.event.head_commit.message, '[signal-lab-v4-test-log]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v4-extremes-orderflow-replay
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integration patch with captured output
        run: |
          set +e
          python scripts/patch-signal-lab-v4-stage1.py > /tmp/signal-lab-v4-patch.log 2>&1
          code=$?
          cat /tmp/signal-lab-v4-patch.log
          echo "PATCH_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Apply regression fixes
        if: env.PATCH_EXIT == '0'
        run: python scripts/fix-signal-lab-v4-stage1-tests.py

      - name: Publish patch failure for diagnosis
        if: env.PATCH_EXIT != '0'
        run: |
          cp /tmp/signal-lab-v4-patch.log V4_PATCH_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V4_PATCH_FAILURE.txt
          git commit -m "Capture Signal Lab V4 patch failure [signal-lab-v4-patch-log]"
          git push origin HEAD:agent/signal-lab-v4-extremes-orderflow-replay
          exit 1

      - name: Check JavaScript syntax
        if: env.PATCH_EXIT == '0'
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite with captured output
        if: env.PATCH_EXIT == '0'
        run: |
          set +e
          npm test > /tmp/signal-lab-v4-tests.log 2>&1
          code=$?
          cat /tmp/signal-lab-v4-tests.log
          echo "TEST_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Publish test failure for diagnosis
        if: env.PATCH_EXIT == '0' && env.TEST_EXIT != '0'
        run: |
          cp /tmp/signal-lab-v4-tests.log V4_TEST_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V4_TEST_FAILURE.txt
          git commit -m "Capture Signal Lab V4 regression failure [signal-lab-v4-test-log]"
          git push origin HEAD:agent/signal-lab-v4-extremes-orderflow-replay
          exit 1

      - name: Commit clean implementation
        if: env.PATCH_EXIT == '0' && env.TEST_EXIT == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-signal-lab-v4-stage1.yml scripts/patch-signal-lab-v4-stage1.py scripts/fix-signal-lab-v4-stage1-tests.py V4_PATCH_FAILURE.txt V4_TEST_FAILURE.txt
          git add signal-lab-v3-collector.js signal-lab-v3-evidence.js signal-lab-v3-full-chart.js signal-lab-v3-replay-ui.js signal-lab-v3-store.js owner-signal-lab-v3.html owner-signal-lab-v3.js owner-signal-lab-v3-evidence.css signal-lab-v4-extremes.js signal-lab-v4-orderflow-recorder.js signal-lab-v4-orderflow-replay.js test/signal-lab-v3-collector.test.js test/signal-lab-v3-evidence.test.js test/signal-lab-v3-full-chart.test.js test/signal-lab-v4-extremes.test.js test/signal-lab-v4-orderflow-recorder.test.js test/signal-lab-v4-integration.test.js docs/signal-lab-v4-extremes-orderflow-stage1.md
          git commit -m "Add Signal Lab V4 extrema and order-flow replay [signal-lab-v4-stage1-applied]"
          git push origin HEAD:agent/signal-lab-v4-extremes-orderflow-replay
