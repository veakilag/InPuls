name: Apply Signal Lab V4 stage one

on:
  push:
    branches:
      - agent/signal-lab-v4-extremes-orderflow-replay

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v4-stage1-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v4-extremes-orderflow-replay
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply integration patch
        run: python scripts/patch-signal-lab-v4-stage1.py

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: npm test

      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-signal-lab-v4-stage1.yml scripts/patch-signal-lab-v4-stage1.py
          git add signal-lab-v3-collector.js signal-lab-v3-evidence.js signal-lab-v3-full-chart.js signal-lab-v3-replay-ui.js signal-lab-v3-store.js owner-signal-lab-v3.html owner-signal-lab-v3.js owner-signal-lab-v3-evidence.css signal-lab-v4-extremes.js signal-lab-v4-orderflow-recorder.js signal-lab-v4-orderflow-replay.js test/signal-lab-v4-extremes.test.js test/signal-lab-v4-orderflow-recorder.test.js test/signal-lab-v4-integration.test.js docs/signal-lab-v4-extremes-orderflow-stage1.md
          git commit -m "Add Signal Lab V4 extrema and order-flow replay [signal-lab-v4-stage1-applied]"
          git push origin HEAD:agent/signal-lab-v4-extremes-orderflow-replay
