name: Apply Signal Lab V4.1 calibration ownership cleanup

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v4-1-calibration-ownership.py
      - .github/workflows/apply-signal-lab-v4-1-calibration-ownership.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply V4.1 patch
        run: python3 scripts/apply-signal-lab-v4-1-calibration-ownership.py

      - name: Validate syntax and diff
        run: |
          node --check owner-signal-lab-structural-extremes-review.js
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          git diff --check

      - name: Run focused structural tests
        run: |
          node --test \
            test/signal-lab-v7-adaptive-hierarchy.test.js \
            test/signal-lab-v7-multi-timeframe-levels.test.js \
            test/signal-lab-v7-structural-extremes-isolation.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V4.1 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner-signal-lab-structural-extremes-review.js signal-lab-v7-multi-timeframe-review-runtime.js
          git commit -m "Clean V4.1 calibration overlays and junior duplicates"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
