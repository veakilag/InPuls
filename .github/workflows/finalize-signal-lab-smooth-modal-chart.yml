name: Finalize Signal Lab smooth modal chart

on:
  push:
    branches:
      - agent/signal-lab-smooth-modal-chart
    paths:
      - .github/workflows/finalize-signal-lab-smooth-modal-chart.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-smooth-modal-chart
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Finalize modal chart implementation
        run: python3 scripts/finalize-signal-lab-smooth-modal-chart.py

      - name: Remove temporary finalizer files
        run: |
          rm -f scripts/finalize-signal-lab-smooth-modal-chart.py
          rm -f .github/workflows/finalize-signal-lab-smooth-modal-chart.yml

      - name: Validate JavaScript syntax
        run: |
          node --check signal-lab-chart-modal.js
          node --check owner-signal-lab-v3.js
          node --check scripts/signal-lab-runtime-smoke.mjs

      - name: Run full test suite
        run: npm test

      - name: Commit finalized changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize smooth Signal Lab modal chart"
          git push origin HEAD:agent/signal-lab-smooth-modal-chart
