name: Apply Tape series mode

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/agent-tape-series-mode-v1.yml
      - tools/apply-tape-series-mode-v1.py

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/tape-series-mode-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tape-series-mode-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply focused patch
        run: python tools/apply-tape-series-mode-v1.py

      - name: Check runtime syntax
        run: |
          node --check orderbook.js
          node --check sw.js

      - name: Run full tests
        run: npm test

      - name: Commit verified runtime
        run: |
          rm -f tools/apply-tape-series-mode-v1.py .github/workflows/agent-tape-series-mode-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Tape series mode" -m "Cycle RAW, AGG and SERIES, aggregate same-side aggression until reversal, and split quiet runs after 500 ms."
          git push origin HEAD:agent/tape-series-mode-v1
