name: Apply water Tape performance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-performance:
    if: github.head_ref == 'agent/water-tape-renderer-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hot-path changes
        run: python .github/scripts/apply-water-tape-performance-v1.py
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check app.js
          node --check test-water-tape-performance-v1.mjs
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-water-tape-performance-v1.py
          rm -f .github/workflows/apply-water-tape-performance-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "perf: stabilize Tape frame hot path"
          git push origin HEAD:${{ github.head_ref }}
