name: Apply event radar beta v1

on:
  push:
    branches:
      - agent/event-radar-beta-v1
    paths:
      - event-radar-beta.js
      - event-radar-beta.css
      - test-event-radar-beta-v1.mjs
      - scripts/apply-event-radar-beta-v1.mjs
      - .github/workflows/apply-event-radar-beta-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply widget integration
        run: node scripts/apply-event-radar-beta-v1.mjs

      - name: Syntax checks
        run: |
          node --check app.js
          node --check event-radar-beta.js
          node --check scripts/apply-event-radar-beta-v1.mjs

      - name: Widget regression tests
        run: node --test test-event-radar-beta-v1.mjs

      - name: Full test suite
        run: npm test

      - name: Remove temporary automation files
        run: rm -f scripts/apply-event-radar-beta-v1.mjs .github/workflows/apply-event-radar-beta-v1.yml

      - name: Commit integrated implementation
        run: |
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add isolated event radar beta widget"
          git push
