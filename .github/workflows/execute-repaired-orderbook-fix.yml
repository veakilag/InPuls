name: Execute repaired orderbook fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/orderbook-static-tape-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute repaired patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/apply-orderbook-static-tape-navigation-v2.yml').read_text(encoding='utf-8')
          match = re.search(r"python - <<'PY'\n([\s\S]*?)\n          PY", source)
          if not match:
              raise SystemExit('embedded patch script not found')
          script = textwrap.dedent(match.group(1))
          fallback = r'''
          def sub1(text, pattern, replacement, label):
              def literal_with_captures(match):
                  result = replacement
                  for index, value in enumerate(match.groups(), start=1):
                      result = result.replace(f"\\{index}", value or "")
                  return result.replace("\\n", "\n").replace("\\t", "\t")
              new, count = re.subn(pattern, literal_with_captures, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: {count} matches")
              return new

          _strict_once = once
          def once(text, old, new, label):
              if label == "button order" and text.count(old) != 1:
                  pattern = r'<button data-inpuls-tape-visible class="inpuls-layer-toggle" type="button" title="Показать или скрыть ленту">ЛЕНТА</button>\s*<button data-inpuls-clusters-visible class="inpuls-layer-toggle" type="button" title="Показать или скрыть footprint-кластеры">КЛАСТЕРЫ</button>'
                  replacement = '<button data-inpuls-clusters-visible class="inpuls-layer-toggle" type="button" title="Показать или скрыть footprint-кластеры">КЛАСТЕРЫ</button>\n      <button data-inpuls-tape-visible class="inpuls-layer-toggle" type="button" title="Показать или скрыть ленту">ЛЕНТА</button>'
                  return sub1(text, pattern, replacement, label)
              return _strict_once(text, old, new, label)

          '''
          script, count = re.subn(r'(?=def patch_app\(text\):)', lambda _: fallback, script, count=1)
          if count != 1:
              raise SystemExit('patch_app insertion point not found')
          exec(compile(script, '<repaired-orderbook-patch>', 'exec'), {'__name__': '__main__'})

          def replace_test(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one test anchor, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_test(
              'test-orderbook-manual-scroll.mjs',
              '    /model\\.bookScaleIndex = bookScaleIndexForWheel\\(model\\.bookScaleIndex, event\\.deltaY\\);/,',
              '    /const nextScaleIndex = bookScaleIndexForWheel\\(previousScaleIndex, event\\.deltaY\\);[\\s\\S]*model\\.bookScaleIndex = nextScaleIndex;_/,'.replace(';_/', ';/'),
              'persisted market-anchored scale assertion',
          )
          replace_test(
              'test-orderbook-visual-priority.mjs',
              '  assert.ok(orderbook.indexOf("data-inpuls-clusters-visible") < orderbook.indexOf("data-inpuls-tape-visible"));',
              '  assert.match(orderbook, /layerControls\\.innerHTML = `[\\s\\S]*data-inpuls-clusters-visible[\\s\\S]*data-inpuls-tape-visible[\\s\\S]*`;/);',
              'header button order assertion',
          )
          replace_test(
              'test/orderbook.test.js',
              '  assert.equal(tapePricePosition(rows, 100.24).y, 17.6);',
              '  assert.ok(Math.abs(tapePricePosition(rows, 100.24).y - 17.6) < 1e-9);',
              'floating interpolation assertion',
          )
          PY
      - name: Syntax checks
        run: |
          node --check app.js
          node --check orderbook.js
      - name: Full tests
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-orderbook-static-tape-navigation-v2.yml
          rm -f .github/workflows/repair-orderbook-fix-workflow.yml
          rm -f .github/workflows/execute-repaired-orderbook-fix.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Tape prices and orderbook navigation"
          git push origin HEAD:${{ github.head_ref }}
