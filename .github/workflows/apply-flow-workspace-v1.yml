name: Apply Flow Workspace v1

on:
  push:
    branches:
      - agent/flow-workspace-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write Flow Workspace files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("orderbook-flow-workspace.js").write_bytes(base64.b64decode(""))
          Path("test-orderbook-flow-workspace.mjs").write_bytes(base64.b64decode(""))
          Path("/tmp/apply-flow-workspace-v1.py").write_bytes(base64.b64decode(""))
          PY

      - name: Integrate Flow Workspace
        run: python /tmp/apply-flow-workspace-v1.py

      - name: Validate JavaScript
        run: |
          node --input-type=module --check < orderbook.js
          node --check orderbook-flow-workspace.js
          node --check sw.js
          node --check test-orderbook-flow-workspace.mjs

      - name: Run orderbook tests
        run: node --test test-orderbook-*.mjs

      - name: Commit Flow Workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Add Flow Workspace v1"
          git push
