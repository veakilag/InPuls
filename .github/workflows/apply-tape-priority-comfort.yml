name: Apply Tape priority comfort patch

on:
  push:
    branches:
      - fix/tape-priority-comfort-preview-v1

permissions:
  contents: write

concurrency:
  group: apply-tape-priority-comfort-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/tape-priority-comfort-preview-v1
          fetch-depth: 0

      - name: Apply scoped runtime patch
        run: python3 scripts/apply-tape-priority-comfort.py

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run focused tests
        run: node --test test-render-lane-isolation-v1.mjs test-comfort-slider-smooth-v1.mjs

      - name: Commit patched runtime
        run: |
          rm .github/workflows/apply-tape-priority-comfort.yml
          rm scripts/apply-tape-priority-comfort.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prioritize Tape over comfort preview"
          git push origin HEAD:fix/tape-priority-comfort-preview-v1
