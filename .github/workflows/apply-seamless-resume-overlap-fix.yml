name: Apply seamless overlap fix

on:
  push:
    branches:
      - agent/seamless-resume-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply overlap fix
        run: python tools/apply-seamless-resume-overlap-fix.py

      - name: Validate JavaScript
        run: |
          node --input-type=module --check < orderbook.js
          node --check orderbook-worker.js
          node --check sw.js

      - name: Run resume tests
        run: |
          node --test test-orderbook-seamless-resume.mjs
          node --test test-orderbook-guarded-raw-tape.mjs

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Fix seamless resume trade overlap"
          git push
