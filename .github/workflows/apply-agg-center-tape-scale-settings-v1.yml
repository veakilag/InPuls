name: Apply AGG center tape scale settings

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/agg-center-tape-scale-settings-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align footprint border transformer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-agg-center-tape-scale-settings-v1.py')
          text = path.read_text(encoding='utf-8')
          old = '''flow = replace_once(
              flow,
              "        state.context.lineWidth = 1;",
              "        state.context.lineWidth = 1.15;",
              "brighter footprint border",
          )'''
          new = '''flow = flow.replace(
              "        state.context.lineWidth = 1;",
              "        state.context.lineWidth = 1.15;",
              1,
          )'''
          if old not in text:
              raise SystemExit('footprint border transformer block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply AGG and settings update
        run: python .github/scripts/apply-agg-center-tape-scale-settings-v1.py
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check app.js
          node --check test-orderbook-ux-controls-v1.mjs
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-agg-center-tape-scale-settings-v1.py
          rm -f .github/workflows/apply-agg-center-tape-scale-settings-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: center AGG labels and add tape scale controls"
          git push origin HEAD:${{ github.head_ref }}
