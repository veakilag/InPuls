name: Fix Resume v2 manager freeze

on:
  push:
    branches:
      - agent/resume-v2-frozen-frame

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write transformer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("/tmp/fix-resume-v2-manager-freeze.py").write_bytes(
            base64.b64decode("")
          )
          PY

      - name: Preserve frozen frames on Worker restart
        run: python /tmp/fix-resume-v2-manager-freeze.py

      - name: Validate JavaScript
        run: |
          node --input-type=module --check < orderbook.js
          node --check test-orderbook-resume-v2.mjs

      - name: Run orderbook tests
        run: node --test test-orderbook-*.mjs

      - name: Commit manager freeze fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Preserve frame on Worker restart"
          git push
