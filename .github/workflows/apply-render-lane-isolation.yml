name: Apply render lane isolation

on:
  push:
    branches:
      - perf/independent-tape-chart-lanes-v1

permissions:
  contents: write

concurrency:
  group: apply-render-lane-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/independent-tape-chart-lanes-v1
          fetch-depth: 0

      - name: Apply scoped source patch
        run: python3 scripts/apply-render-lane-isolation.py

      - name: Commit patched runtime
        run: |
          rm .github/workflows/apply-render-lane-isolation.yml
          rm scripts/apply-render-lane-isolation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: isolate Tape and chart render lanes"
          git push origin HEAD:perf/independent-tape-chart-lanes-v1
