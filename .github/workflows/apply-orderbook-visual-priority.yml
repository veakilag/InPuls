name: Capture visual priority diagnostics

on:
  push:
    branches:
      - agent/orderbook-visual-priority-v1

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture exact source anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = {
              "app.js": [
                  "function patchBookLadderRows",
                  "const anomalous =",
              ],
              "orderbook.js": [
                  ".orderbook-card .book-ladder-row {",
                  ".orderbook-card .book-ladder-row strong {",
                  ".orderbook-card .book-ladder-row.is-bid .book-size::before",
                  ".orderbook-card .book-ladder-row.is-anomaly strong",
              ],
              "orderbook-flow-workspace.js": [
                  "export function footprintTone",
                  "const bucket = accumulator.minutes.get",
                  "bucket.cells.set(priceKey, cell)",
                  "const cells = new Map();",
                  "count += bucket.count",
                  "partial: Number(now) < endTime",
                  "for (const cluster of clusters)",
              ],
          }

          report = []
          for filename, needles in targets.items():
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              report.append(f"===== {filename} =====")
              for needle in needles:
                  matches = [index for index, line in enumerate(lines) if needle in line]
                  report.append(f"\n--- {needle!r}: {len(matches)} match(es) ---")
                  for match in matches[:3]:
                      start = max(0, match - 8)
                      end = min(len(lines), match + 28)
                      for index in range(start, end):
                          report.append(f"{index + 1:04d}: {lines[index]}")
                      report.append("--- end context ---")

          Path("visual-priority-diagnostics.txt").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8",
          )
          Path(".github/workflows/apply-orderbook-visual-priority.yml").unlink(missing_ok=True)
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture visual priority diagnostics"
          git push
