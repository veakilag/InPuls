name: Apply orderbook visual priority

on:
  push:
    branches:
      - agent/orderbook-visual-priority-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply app anomaly tiers
        run: python .github/visual-priority/app_patch.py

      - name: Apply orderbook visual styles
        run: python .github/visual-priority/orderbook_patch.py

      - name: Apply footprint data model
        run: python .github/visual-priority/flow_data_patch.py

      - name: Apply footprint rendering
        run: python .github/visual-priority/flow_render_patch.py

      - name: Finalize runtime and tests
        run: python .github/visual-priority/finalize_patch.py

      - name: Validate JavaScript
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < orderbook.js
          node --check orderbook-flow-workspace.js
          node --check sw.js
          node --check test-orderbook-visual-priority.mjs

      - name: Run orderbook tests
        run: node --test test-orderbook-*.mjs

      - name: Commit visual priority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Improve orderbook visual priority"
          git push
