name: Apply Signal Lab extreme rays

on:
  push:
    branches:
      - agent/signal-lab-extreme-rays
    paths:
      - .github/workflows/apply-signal-lab-extreme-rays.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-extreme-rays
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply extreme ray changes
        run: python3 scripts/apply-signal-lab-extreme-rays.py

      - name: Remove temporary apply files
        run: |
          rm -f scripts/apply-signal-lab-extreme-rays.py
          rm -f .github/workflows/apply-signal-lab-extreme-rays.yml

      - name: Validate syntax and diff
        run: |
          node --check chart.js
          node --check signal-lab-v3-full-chart.js
          node --check signal-lab-chart-modal.js
          node --check owner-signal-lab-v3.js
          node --check scripts/signal-lab-runtime-smoke.mjs
          git diff --check

      - name: Run full test suite and capture diagnostics
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          echo "$status" > test-exit-code.txt
          exit 0

      - name: Commit generated changes and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render active extrema as right-facing rays [diagnostics]"
          git push origin HEAD:agent/signal-lab-extreme-rays
