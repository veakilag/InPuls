name: Apply flow candles series header

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/agent-flow-candles-series-header-v1.yml
      - tools/apply-flow-candles-series-header-v1.py

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/flow-candles-series-header-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/flow-candles-series-header-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fix patcher boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-flow-candles-series-header-v1.py')
          text = path.read_text(encoding='utf-8')
          old = 'orderbook = replace_js_function(orderbook, "aggregateTapeSeries", new_series)'
          new = '''series_start = orderbook.find("export function aggregateTapeSeries(")
          series_end = orderbook.find("\\nexport function materializeZeroMsAggregates", series_start)
          if series_start < 0 or series_end < 0:
              raise SystemExit("aggregateTapeSeries boundaries not found")
          orderbook = orderbook[:series_start] + new_series.rstrip() + orderbook[series_end:]'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one aggregate replacement call, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply focused patch
        run: python tools/apply-flow-candles-series-header-v1.py

      - name: Update intended contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'test-flow-candles-series-header-v1.mjs',
              'for (const path of ["./index.html", "./app.js", "./orderbook.js", "./orderbook-flow-workspace.js", "./sw.js"]) {',
              'for (const path of ["./index.html", "./app.js", "./orderbook.js", "./sw.js"]) {',
          )

          old_high = r'/const highRow = nearestRow\(rows, interval\.highPrice\)/'
          new_high = r'/const highRow = nearestRow\(rows, interval\.highPrice, true\)/'
          for path in ('test-orderbook-flow-workspace.mjs', 'test-orderbook-visual-priority.mjs'):
              replace_once(path, old_high, new_high)

          replace_once(
              'test-orderbook-visual-priority.mjs',
              r'/const lowRow = nearestRow\(rows, interval\.lowPrice\)/',
              r'/const lowRow = nearestRow\(rows, interval\.lowPrice, true\)/',
          )
          replace_once(
              'test-orderbook-visual-priority.mjs',
              r'/rising[\s\S]*theme\.bullFill[\s\S]*theme\.bearFill/',
              r'/state\.context\.fillStyle = theme\.bearFill/',
          )
          replace_once(
              'test-orderbook-visual-priority.mjs',
              r'/const bodyWidth = candleBodyWidth/',
              r'/const bodyWidth = Math\.max\(2, Math\.min\(8, candleBodyWidth \* 1\.22\)\)/',
          )

          for old, new in (
              (r'/height - 22/', r'/height - 28/'),
              (r'/height - 16/', r'/height - 19/'),
              (r'/height - 5/', r'/height - 6/'),
          ):
              replace_once('test-tape-arrival-clock-v1.mjs', old, new)
          PY

      - name: Check runtime syntax
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check app.js
          node --check sw.js

      - name: Run full tests
        run: npm test

      - name: Commit verified runtime
        run: |
          rm -f tools/apply-flow-candles-series-header-v1.py .github/workflows/agent-flow-candles-series-header-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish flow candles and Tape series" -m "Stabilize footprint price projection, keep partial candles visible, render SERIES as a staircase, enlarge time labels and return brightness to the header."
          git push origin HEAD:agent/flow-candles-series-header-v1
