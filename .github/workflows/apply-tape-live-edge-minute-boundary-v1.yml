name: Apply Tape live edge minute boundary v1

on:
  push:
    branches:
      - fix/tape-live-edge-minute-boundary-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Tape live edge and minute boundary runtime patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/tape-live-edge-minute-boundary-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Repair one-time patcher helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-tape-live-edge-minute-boundary-v1.mjs')
          source = path.read_text()
          source = source.replace(
              'replaceOnce(clockTest, /26-101-binance-clock-sync-v1/g.source, BUILD);',
              'write(clockTest, read(clockTest).replaceAll("26-101-binance-clock-sync-v1", BUILD));',
          )
          path.write_text(source)
          PY

      - name: Apply runtime patch
        run: node scripts/apply-tape-live-edge-minute-boundary-v1.mjs

      - name: Verify syntax and focused tests
        run: |
          node --check binance-clock.js
          node --check chart.js
          node --check orderbook.js
          node --check app.js
          node --test test-binance-clock-sync-v1.mjs test-tape-live-edge-minute-boundary-v1.mjs test-canvas-comfort-preview-v1.mjs

      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binance-clock.js chart.js orderbook.js app.js index.html sw.js styles.css test-binance-clock-sync-v1.mjs test-tape-live-edge-minute-boundary-v1.mjs
          git commit -m "Apply Tape live edge and minute boundary runtime patch"
          git push origin HEAD:fix/tape-live-edge-minute-boundary-v1
