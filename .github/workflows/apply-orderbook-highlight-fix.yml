name: Apply orderbook highlight invariant fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/fix-orderbook-highlight-values'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused orderbook fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          OLD_BUILD = "26-55-scalper-pattern-evidence-v1"
          NEW_BUILD = "26-66-orderbook-highlight-invariant-v1"

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          app = Path("app.js")
          text = app.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "aggregateFootprintClusters, aggregateTradePath, bookDisplayedQuote,",
              "aggregateFootprintClusters, aggregateTradePath, bookAnomalyQuote, bookDisplayedQuote,",
              "app.js import",
          )
          scale_pattern = re.compile(
              r'  // AUTO shows the largest real order inside an aggregated row, so its bar\n'
              r'  // uses the full-book real-order maximum\. Manual ≥ \$ keeps the band total\.\n'
              r'  const automaticHighlight = panel\.model\.highlightMode !== "manual";\n'
              r'  const maxSize = automaticHighlight\n'
              r'    \? fullBookMaximum\n'
              r'    : Math\.max\(\n'
              r'      fullBookMaximum,\n'
              r'      \.\.\.rows\.map\(\(row\) => Math\.max\(0, Number\(row\.quote\) \|\| 0\)\),\n'
              r'    \);'
          )
          scale_replacement = (
              "  // Highlight mode controls only anomaly classification. The visible size and\n"
              "  // its bar always use the same aggregated price-row total, so AUTO/manual\n"
              "  // switching can never rewrite liquidity values or rescale the ladder.\n"
              "  const maxSize = Math.max(\n"
              "    fullBookMaximum,\n"
              "    ...rows.map((row) => bookDisplayedQuote(row)),\n"
              "  );"
          )
          text, count = scale_pattern.subn(scale_replacement, text, count=1)
          if count != 1:
              raise SystemExit("app.js size-scale block changed")
          text = replace_once(
              text,
              "    const anomalyReference = bookDisplayedQuote(source, automatic);",
              "    const displayedQuote = bookDisplayedQuote(source);\n    const anomalyReference = bookAnomalyQuote(source, automatic);",
              "app.js anomaly/display split",
          )
          text = replace_once(
              text,
              "(anomalyReference / maxSize)",
              "(displayedQuote / maxSize)",
              "app.js size bar",
          )
          text = replace_once(
              text,
              'const sizeText = anomalyReference > 0 ? formatCompactUsd(anomalyReference) : "";',
              'const sizeText = displayedQuote > 0 ? formatCompactUsd(displayedQuote) : "";',
              "app.js size label",
          )
          app.write_text(text, encoding="utf-8")

          orderbook = Path("orderbook.js")
          text = orderbook.read_text(encoding="utf-8")
          helper_pattern = re.compile(
              r'export function bookDisplayedQuote\(row, automatic = false\) \{\n'
              r'  const total = Math\.max\(0, Number\(row\?\.quote\) \|\| 0\);\n'
              r'  const largestRealLevel = Math\.max\(0, Number\(row\?\.maxLevelQuote\) \|\| 0\);\n'
              r'  return automatic && largestRealLevel > 0 \? largestRealLevel : total;\n'
              r'\}'
          )
          helper_replacement = (
              "export function bookDisplayedQuote(row) {\n"
              "  return Math.max(0, Number(row?.quote) || 0);\n"
              "}\n\n"
              "export function bookAnomalyQuote(row, automatic = false) {\n"
              "  const total = bookDisplayedQuote(row);\n"
              "  const largestRealLevel = Math.max(0, Number(row?.maxLevelQuote) || 0);\n"
              "  return automatic && largestRealLevel > 0 ? largestRealLevel : total;\n"
              "}"
          )
          text, count = helper_pattern.subn(helper_replacement, text, count=1)
          if count != 1:
              raise SystemExit("orderbook.js display helper changed")
          orderbook.write_text(text, encoding="utf-8")

          tests = Path("test/orderbook.test.js")
          text = tests.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "  bookDepthLabel,\n  bookDisplayedQuote,",
              "  bookAnomalyQuote,\n  bookDepthLabel,\n  bookDisplayedQuote,",
              "orderbook test import",
          )
          text = replace_once(
              text,
              'test("AUTO can inspect the largest real order without treating an aggregated row as one order", () => {',
              'test("highlight modes preserve displayed size while AUTO inspects the largest real order", () => {',
              "orderbook regression test title",
          )
          text = replace_once(
              text,
              "  assert.equal(bookDisplayedQuote(aggregated, true), aggregated.maxLevelQuote);\n  assert.equal(bookDisplayedQuote(aggregated, false), aggregated.quote);",
              "  assert.equal(bookDisplayedQuote(aggregated), aggregated.quote);\n  assert.equal(bookAnomalyQuote(aggregated, true), aggregated.maxLevelQuote);\n  assert.equal(bookAnomalyQuote(aggregated, false), aggregated.quote);",
              "orderbook regression assertions",
          )
          tests.write_text(text, encoding="utf-8")

          visual = Path("test-orderbook-visual-priority.mjs")
          text = visual.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "  assert.match(app, /bookDisplayedQuote\\(source, automatic\\)/);\n  assert.match(app, /const automaticHighlight = panel\\.model\\.highlightMode !== \"manual\"/);\n  assert.match(app, /rows\\.map\\(\\(row\\) => Math\\.max\\(0, Number\\(row\\.quote\\) \\|\\| 0\\)\\)/);",
              "  assert.match(app, /const displayedQuote = bookDisplayedQuote\\(source\\)/);\n  assert.match(app, /const anomalyReference = bookAnomalyQuote\\(source, automatic\\)/);\n  assert.match(app, /rows\\.map\\(\\(row\\) => bookDisplayedQuote\\(row\\)\\)/);\n  assert.match(app, /const sizeText = displayedQuote > 0/);\n  assert.doesNotMatch(app, /const sizeText = anomalyReference > 0/);",
              "visual priority invariant assertions",
          )
          visual.write_text(text, encoding="utf-8")

          ui = Path("test/ui.test.js")
          text = ui.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "  assert.match(app, /const maxSize = automaticHighlight[\\s\\S]*\\? fullBookMaximum[\\s\\S]*rows\\.map\\(\\(row\\) => Math\\.max\\(0, Number\\(row\\.quote\\) \\|\\| 0\\)\\)/);",
              "  assert.match(app, /const maxSize = Math\\.max\\([\\s\\S]*fullBookMaximum[\\s\\S]*rows\\.map\\(\\(row\\) => bookDisplayedQuote\\(row\\)\\)/);\n  assert.match(app, /const displayedQuote = bookDisplayedQuote\\(source\\)/);\n  assert.match(app, /const anomalyReference = bookAnomalyQuote\\(source, automatic\\)/);",
              "DOM highlight invariant assertion",
          )
          ui.write_text(text, encoding="utf-8")

          text_suffixes = {".js", ".mjs", ".html", ".css", ".txt", ".json", ".webmanifest", ".md"}
          for file in Path(".").rglob("*"):
              if not file.is_file() or ".git" in file.parts or ".github" in file.parts:
                  continue
              if file.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = file.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if OLD_BUILD in text:
                  file.write_text(text.replace(OLD_BUILD, NEW_BUILD), encoding="utf-8")

          version = Path("VERSION.txt")
          text = version.read_text(encoding="utf-8")
          if "highlight-display-invariant-v1" not in text:
              text = text.rstrip() + ", highlight-display-invariant-v1\n"
          version.write_text(text, encoding="utf-8")
          PY

      - name: Run test suite
        run: npm test

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-orderbook-highlight-fix.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep orderbook sizes stable across highlight modes"
          git push origin HEAD:${{ github.head_ref }}
