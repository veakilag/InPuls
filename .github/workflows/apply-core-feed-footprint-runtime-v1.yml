name: Apply core feed footprint runtime recovery

on:
  push:
    branches:
      - fix/core-feed-footprint-runtime-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-feed-footprint-runtime-v1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Harden migration anchor
        run: python .github/scripts/patch-core-feed-migration-anchor-v1.py

      - name: Apply runtime recovery
        run: python .github/scripts/apply-core-feed-footprint-runtime-v1.py

      - name: Syntax checks
        run: |
          node --check app.js
          node --check binance-stream-routing.js
          node --check chart.js
          node --check orderbook-worker.js
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check sw.js

      - name: Focused critical regressions
        run: |
          node --test test-global-connection-radar-cleanup-v1.mjs
          node --test test-core-feed-footprint-runtime-v1.mjs
          node --test test-market-feed-footprint-series-v1.mjs
          node --test test-footprint-live-source-v1.mjs
          node --test test-parallel-chart-phasing-v1.mjs
          node --test test-orderbook-runtime-stability.mjs
          node --test test-orderbook-flow-workspace.mjs

      - name: Capture exact full-suite failure
        run: |
          set +e
          node --test --test-concurrency=1 > /tmp/full-test.log 2>&1
          status=$?
          set -e
          printf '%s\n' '--- exact failing tests ---'
          grep -n -B8 -A30 '^not ok' /tmp/full-test.log || true
          printf '%s\n' '--- matching source text ---'
          grep -R -n --include='*.mjs' "SymbolModel trade windows\|model.updateTrade" . || true
          exit ${status:-1}
