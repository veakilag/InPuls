name: Apply arrival clock and decouple market render

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/arrival-clock-no-global-render-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply implementation
        run: python tools/apply_arrival_clock_no_global_render_v1.py

      - name: Syntax checks
        run: |
          node --check app.js
          node --check orderbook.js
          node --check orderbook-worker.js
          node --check test-arrival-clock-render-decouple-v1.mjs

      - name: Full test suite
        run: npm test

      - name: Remove patch scaffolding
        run: |
          rm -f tools/apply_arrival_clock_no_global_render_v1.py
          rm -f .github/workflows/apply-arrival-clock-no-global-render-v1.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use arrival time for live Tape and decouple market renders"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
