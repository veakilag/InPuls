name: PR 104 verified browser recovery

on:
  push:
    branches:
      - fix/core-feed-footprint-runtime-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/core-feed-footprint-runtime-v1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply guarded clock startup fix
        run: python .github/scripts/patch-clock-startup-order-v1.py

      - name: Verify syntax and full regression suite
        run: |
          node --check app.js
          node --test test-core-feed-footprint-runtime-v1.mjs
          npm test

      - name: Install isolated Chromium smoke runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start InPuls
        run: |
          npm start > /tmp/inpuls-server.log 2>&1 &
          echo $! > /tmp/inpuls-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/inpuls-server.log
          exit 1

      - name: Verify browser startup, REST fallback, keyed rows and Footprint
        run: |
          cat > /tmp/browser-smoke-pr104.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const APP_URL = "http://127.0.0.1:4173/";
          const tickerNow = Date.now();
          const restRows = [
            {
              symbol: "BTCUSDT",
              closeTime: tickerNow,
              lastPrice: "64000.50",
              openPrice: "62500.00",
              highPrice: "64500.00",
              lowPrice: "62000.00",
              volume: "12345.67",
              quoteVolume: "790000000.25"
            },
            {
              symbol: "ETHUSDT",
              closeTime: tickerNow,
              lastPrice: "3500.25",
              openPrice: "3400.00",
              highPrice: "3550.00",
              lowPrice: "3350.00",
              volume: "234567.89",
              quoteVolume: "820000000.75"
            }
          ];

          async function poll(check, timeoutMs, description) {
            const startedAt = Date.now();
            while (Date.now() - startedAt < timeoutMs) {
              if (await check()) return;
              await new Promise((resolve) => setTimeout(resolve, 200));
            }
            throw new Error(`Timed out waiting for ${description}`);
          }

          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({ serviceWorkers: "block" });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on("pageerror", (error) => pageErrors.push(String(error?.stack || error)));
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });

            await page.addInitScript(() => {
              localStorage.setItem("inpuls-workspace-v4", JSON.stringify({
                primary: { id: "primary", type: "chart", x: 0, y: 0, w: 12, h: 6 },
                radar: { id: "radar", type: "radar", x: 12, y: 0, w: 6, h: 6 },
                scanner: { id: "scanner", type: "scanner", x: 0, y: 9, w: 24, h: 3, hidden: true },
                extras: [{
                  id: "browser-smoke-orderbook",
                  type: "orderbook",
                  symbol: "BTCUSDT",
                  x: 18,
                  y: 0,
                  w: 6,
                  h: 6,
                  bookScaleIndex: 3,
                  bookCentered: true,
                  tapePercent: 48,
                  tradeMinQuote: 0,
                  tradeWindowMs: 60000,
                  clustersVisible: true,
                  highlightMode: "auto",
                  highlightMinQuote: 100000
                }]
              }));
            });

            await page.routeWebSocket(/wss:\/\/fstream\.binance\.com\/.*/, (socket) => socket.close());
            for (const host of ["fapi.binance.com", "fapi1.binance.com", "fapi2.binance.com"]) {
              await page.route(`https://${host}/**`, async (route) => {
                const url = new URL(route.request().url());
                if (url.pathname === "/fapi/v1/ticker/24hr") {
                  await route.fulfill({
                    status: 200,
                    contentType: "application/json",
                    headers: { "access-control-allow-origin": "*" },
                    body: JSON.stringify(restRows)
                  });
                  return;
                }
                await route.abort("failed");
              });
            }

            await page.goto(APP_URL, { waitUntil: "domcontentloaded" });
            await page.evaluate(() => {
              const element = document.querySelector("#connection-text");
              globalThis.__inpulsStatusHistory = [element?.textContent || ""];
              if (element) {
                new MutationObserver(() => {
                  globalThis.__inpulsStatusHistory.push(element.textContent || "");
                }).observe(element, { childList: true, characterData: true, subtree: true });
              }
            });

            await poll(
              async () => (await page.locator("#market-body tr").count()) >= 2,
              20_000,
              "two normalized market rows"
            );
            await poll(
              () => page.evaluate(() => (globalThis.__inpulsStatusHistory || []).some((value) => value.includes("REST-резерв"))),
              15_000,
              "REST fallback status"
            );
            await poll(
              async () => (await page.locator(".inpuls-footprint-canvas").count()) >= 1,
              10_000,
              "Footprint canvas"
            );

            const firstState = await page.evaluate(() => {
              globalThis.__inpulsFirstMarketRow = document.querySelector("#market-body tr");
              return {
                build: document.querySelector('meta[name="inpuls-build"]')?.content || "",
                rows: document.querySelectorAll("#market-body tr").length,
                symbols: [...document.querySelectorAll("#market-body .pair-name")].map((node) => node.textContent?.trim()),
                statusHistory: globalThis.__inpulsStatusHistory || [],
                clock: document.querySelector("#clock")?.textContent?.trim() || "",
                footprintCanvasCount: document.querySelectorAll(".inpuls-footprint-canvas").length
              };
            });
            assert.equal(firstState.build, "26-89-core-feed-footprint-runtime-v1");
            assert.equal(firstState.rows, 2);
            assert.deepEqual(new Set(firstState.symbols), new Set(["BTC", "ETH"]));
            assert.match(firstState.clock, /^\d{2}:\d{2}:\d{2}$/);
            assert.ok(firstState.statusHistory.some((value) => value.includes("REST-резерв")));
            assert.ok(firstState.footprintCanvasCount >= 1);

            await page.evaluate(() => {
              const now = Date.now();
              dispatchEvent(new CustomEvent("inpuls:tape-data", {
                detail: {
                  symbol: "BTCUSDT",
                  live: true,
                  trades: [{
                    id: "browser-smoke-trade",
                    price: 64000.5,
                    quantity: 0.01,
                    quote: 640.005,
                    time: now,
                    tradeTime: now,
                    receivedAt: now,
                    side: "buy"
                  }]
                }
              }));
            });
            await page.waitForTimeout(750);
            assert.ok(!pageErrors.some((error) => /incoming is not defined/i.test(error)), pageErrors.join("\n"));

            await page.waitForTimeout(10_750);
            const stableRowIdentity = await page.evaluate(
              () => document.querySelector("#market-body tr") === globalThis.__inpulsFirstMarketRow
            );
            assert.equal(stableRowIdentity, true, "Market row identity changed across fallback batches");
            assert.equal(pageErrors.length, 0, pageErrors.join("\n"));
            assert.equal(consoleErrors.length, 0, consoleErrors.join("\n"));

            console.log("DETERMINISTIC_BROWSER_SMOKE", JSON.stringify({
              build: firstState.build,
              rows: firstState.rows,
              symbols: firstState.symbols,
              clock: firstState.clock,
              restFallbackSeen: true,
              footprintEventAccepted: true,
              stableRowIdentity
            }));
            await context.close();

            const liveContext = await browser.newContext({ serviceWorkers: "block" });
            const livePage = await liveContext.newPage();
            const liveErrors = [];
            livePage.on("pageerror", (error) => liveErrors.push(String(error?.stack || error)));
            await livePage.goto(APP_URL, { waitUntil: "domcontentloaded" });
            await livePage.waitForTimeout(20_000);
            const liveState = await livePage.evaluate(() => ({
              rows: document.querySelectorAll("#market-body tr").length,
              status: document.querySelector("#connection-text")?.textContent?.trim() || "",
              inplay: document.querySelector("#inplay-coins")?.textContent?.trim() || ""
            }));
            console.log("LIVE_BINANCE_PROBE", JSON.stringify({ ...liveState, pageErrors: liveErrors }));
            await liveContext.close();
          } finally {
            await browser.close();
          }
          EOF
          node /tmp/browser-smoke-pr104.mjs

      - name: Commit verified runtime fix
        run: |
          rm -rf node_modules
          git rm -f .github/scripts/patch-clock-startup-order-v1.py
          git rm -f .github/workflows/browser-smoke-pr104.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js test-core-feed-footprint-runtime-v1.mjs
          git commit -m "Initialize clock state before app startup"
          git push origin HEAD:fix/core-feed-footprint-runtime-v1

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/inpuls-server.log || true
