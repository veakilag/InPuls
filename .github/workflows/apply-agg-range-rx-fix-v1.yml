name: Apply AGG range and RX fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/agg-range-rx-latency-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply AGG range and RX fix
        run: python .github/scripts/apply-agg-range-rx-fix-v1.py
      - name: Align RX latency regression contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("test-orderbook-tape-latency.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''  assert.match(worker, /this\\.tradeLatency\\.record\\(trade\\.rxLatencyMs, receivedAt\\)/);
            assert.match(worker, /RX \\$\\{Math\\.round\\(latency\\)\\}ms/);
          '''
          new = '''  assert.match(worker, /if \\(aggregateEvent\\) this\\.tradeLatency\\.record\\(trade\\.rxLatencyMs, receivedAt\\)/);
            assert.match(worker, /latency < 1\\s*\\? "<1"/);
            assert.match(worker, /return ` · RX \\$\\{value\\}ms`/);
          '''
          if text.count(old) != 1:
              raise AssertionError(f"RX legacy contract: expected 1 match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-worker.js
          node --check orderbook-tape-latency.js
          node --check app.js
          node --check test-agg-range-rx-fix-v1.mjs
          node --check test-orderbook-tape-latency.mjs
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-agg-range-rx-fix-v1.py
          rm -f .github/workflows/apply-agg-range-rx-fix-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: render AGG price range and correct RX latency"
          git push origin HEAD:${{ github.head_ref }}
