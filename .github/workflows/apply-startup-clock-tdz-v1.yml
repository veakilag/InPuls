name: Apply startup clock TDZ hotfix

on:
  push:
    branches:
      - fix/startup-clock-tdz-v1
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/startup-clock-tdz-v1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply startup hotfix
        run: python .github/scripts/apply-startup-clock-tdz-v1.py

      - name: Syntax and full regression suite
        run: |
          node --check app.js
          node --check binance-stream-routing.js
          node --check orderbook-flow-workspace.js
          npm test

      - name: Install isolated browser runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start InPuls
        run: |
          npm start > /tmp/inpuls-server.log 2>&1 &
          echo $! > /tmp/inpuls-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/inpuls-server.log
          exit 1

      - name: Browser startup and market fallback smoke
        run: |
          cat > .startup-clock-smoke.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const now = Date.now();
          const rows = [
            { symbol: "BTCUSDT", closeTime: now, lastPrice: "64000.5", openPrice: "62500", highPrice: "64500", lowPrice: "62000", volume: "12345", quoteVolume: "790000000" },
            { symbol: "ETHUSDT", closeTime: now, lastPrice: "3500.25", openPrice: "3400", highPrice: "3550", lowPrice: "3350", volume: "234567", quoteVolume: "820000000" }
          ];

          async function poll(check, timeout, label) {
            const started = Date.now();
            while (Date.now() - started < timeout) {
              if (await check()) return;
              await new Promise((resolve) => setTimeout(resolve, 200));
            }
            throw new Error(`Timed out waiting for ${label}`);
          }

          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({ serviceWorkers: "block" });
            const page = await context.newPage();
            const errors = [];
            page.on("pageerror", (error) => errors.push(String(error?.stack || error)));
            await page.routeWebSocket(/wss:\/\/fstream\.binance\.com\/.*/, (socket) => socket.close());
            for (const host of ["fapi.binance.com", "fapi1.binance.com", "fapi2.binance.com"]) {
              await page.route(`https://${host}/**`, async (route) => {
                const url = new URL(route.request().url());
                if (url.pathname === "/fapi/v1/ticker/24hr") {
                  await route.fulfill({ status: 200, contentType: "application/json", headers: { "access-control-allow-origin": "*" }, body: JSON.stringify(rows) });
                  return;
                }
                await route.abort("failed");
              });
            }

            await page.goto("http://127.0.0.1:4173/", { waitUntil: "domcontentloaded" });
            await poll(async () => (await page.locator("#market-body tr").count()) >= 2, 20_000, "market rows");
            await poll(async () => (await page.locator("#connection-text").textContent() || "").includes("REST-резерв"), 15_000, "REST fallback status");

            const state = await page.evaluate(() => ({
              build: document.querySelector('meta[name="inpuls-build"]')?.content || "",
              rows: document.querySelectorAll("#market-body tr").length,
              symbols: [...document.querySelectorAll("#market-body .pair-name")].map((node) => node.textContent?.trim()),
              inplay: document.querySelector("#inplay-coins")?.textContent?.trim() || "",
              status: document.querySelector("#connection-text")?.textContent?.trim() || "",
              clock: document.querySelector("#clock")?.textContent?.trim() || ""
            }));

            assert.equal(state.build, "26-89-core-feed-footprint-runtime-v1");
            assert.equal(state.rows, 2);
            assert.deepEqual(new Set(state.symbols), new Set(["BTC", "ETH"]));
            assert.match(state.inplay, /BTC|ETH/);
            assert.match(state.status, /REST-резерв/);
            assert.match(state.clock, /^\d{2}:\d{2}:\d{2}$/);
            assert.equal(errors.length, 0, errors.join("\n"));
            console.log("STARTUP_CLOCK_SMOKE", JSON.stringify(state));
          } finally {
            await browser.close();
          }
          EOF
          node .startup-clock-smoke.mjs
          rm -f .startup-clock-smoke.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/inpuls-server.log || true

      - name: Commit verified hotfix
        run: |
          git rm .github/scripts/apply-startup-clock-tdz-v1.py
          git rm .github/workflows/apply-startup-clock-tdz-v1.yml
          rm -f .github/STARTUP_CLOCK_HOTFIX_TRIGGER
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix startup clock initialization order"
          git push origin HEAD:fix/startup-clock-tdz-v1
