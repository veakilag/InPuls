name: Apply Signal Lab extreme runtime hotfix

on:
  push:
    branches:
      - fix/signal-lab-extreme-collection-performance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/signal-lab-extreme-collection-performance
          fetch-depth: 0

      - name: Apply deterministic hotfix
        id: patch
        continue-on-error: true
        run: |
          set +e
          python3 scripts/apply-signal-lab-extreme-runtime-hotfix.py > hotfix-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> hotfix-diagnostic.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Preserve failed patch diagnostics
        if: steps.patch.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotfix-diagnostic.txt
          git commit -m "Capture Signal Lab extreme hotfix failure"
          git push origin HEAD:fix/signal-lab-extreme-collection-performance

      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1

      - name: Run complete test suite
        id: tests
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          npm test > npm-test-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> npm-test-diagnostic.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Preserve failed test diagnostics
        if: steps.tests.outcome == 'failure'
        run: |
          {
            grep -n -E "not ok|failureType:|error:|code:|actual:|expected:|operator:|# fail|exit_code=" npm-test-diagnostic.txt || true
            echo "--- tail ---"
            tail -n 220 npm-test-diagnostic.txt
          } > npm-test-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add npm-test-failures.txt
          git commit -m "Capture concise Signal Lab extreme test failure"
          git push origin HEAD:fix/signal-lab-extreme-collection-performance

      - name: Stop after test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Commit verified hotfix
        if: steps.tests.outcome == 'success'
        run: |
          rm -f hotfix-diagnostic.txt npm-test-diagnostic.txt npm-test-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Signal Lab extreme collection and runtime load"
          git push origin HEAD:fix/signal-lab-extreme-collection-performance
