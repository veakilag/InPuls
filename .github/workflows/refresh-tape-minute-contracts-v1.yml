name: Refresh Tape minute contracts v1

on:
  push:
    branches:
      - fix/tape-live-edge-minute-boundary-v1

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'Refresh Tape minute boundary contracts') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/tape-live-edge-minute-boundary-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh build contracts and require calibrated boundary clock
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_clock = '26-101-binance-clock-sync-v1'
          old_chart = '26-97-smooth-chart-first-v1'
          build = '26-102-tape-live-edge-minute-boundary-v1'

          for path in Path('.').glob('test-*.mjs'):
              source = path.read_text()
              updated = source.replace(old_clock, build).replace(old_chart, build)
              if updated != source:
                  path.write_text(updated)

          path = Path('chart.js')
          source = path.read_text()
          anchor = '''    const intervalMs = Number(INTERVAL_MS[this.interval]);
    if (generation !== this.generation || !Number.isFinite(intervalMs) || intervalMs < 60_000) return;
    const now = Number(binanceClock.now());'''
          replacement = '''    const intervalMs = Number(INTERVAL_MS[this.interval]);
    if (
      generation !== this.generation
      || !Number.isFinite(intervalMs)
      || intervalMs < 60_000
      || !binanceClock.isCalibrated()
    ) return;
    const now = Number(binanceClock.now());'''
          count = source.count(anchor)
          if count != 2:
              raise SystemExit(f'chart boundary anchor count: {count}')
          path.write_text(source.replace(anchor, replacement))
          PY

      - name: Run full regression suite
        run: |
          node --check binance-clock.js
          node --check chart.js
          node --check orderbook.js
          node --check app.js
          node --test test-*.mjs

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart.js test-*.mjs
          git commit -m "Refresh Tape minute boundary contracts"
          git push origin HEAD:fix/tape-live-edge-minute-boundary-v1
