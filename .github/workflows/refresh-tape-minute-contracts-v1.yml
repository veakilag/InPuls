# Temporary migration workflow; remove after generated contract commit.
name: Refresh Tape minute contracts v1

on:
  pull_request:
    types: [reopened]
    branches:
      - main
  push:
    branches:
      - fix/tape-live-edge-minute-boundary-v1

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Refresh Tape minute boundary contracts') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/tape-live-edge-minute-boundary-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh build contracts and require calibrated boundary clock
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_clock = '26-101-binance-clock-sync-v1'
          old_chart = '26-97-smooth-chart-first-v1'
          build = '26-102-tape-live-edge-minute-boundary-v1'

          for path in Path('.').glob('test-*.mjs'):
              source = path.read_text()
              updated = source.replace(old_clock, build).replace(old_chart, build)
              if updated != source:
                  path.write_text(updated)

          path = Path('chart.js')
          source = path.read_text()
          schedule_anchor = '''    const intervalMs = Number(INTERVAL_MS[this.interval]);
    if (generation !== this.generation || !Number.isFinite(intervalMs) || intervalMs < 60_000) return;
    const now = Number(binanceClock.now());'''
          schedule_replacement = '''    const intervalMs = Number(INTERVAL_MS[this.interval]);
    if (
      generation !== this.generation
      || !Number.isFinite(intervalMs)
      || intervalMs < 60_000
      || !binanceClock.isCalibrated()
    ) return;
    const now = Number(binanceClock.now());'''
          advance_anchor = '''    const intervalMs = Number(INTERVAL_MS[this.interval]);
    const now = Number(binanceClock.now());
    if (generation !== this.generation || !Number.isFinite(intervalMs) || intervalMs < 60_000 || !Number.isFinite(now)) return;'''
          advance_replacement = '''    const intervalMs = Number(INTERVAL_MS[this.interval]);
    if (
      generation !== this.generation
      || !Number.isFinite(intervalMs)
      || intervalMs < 60_000
      || !binanceClock.isCalibrated()
    ) return;
    const now = Number(binanceClock.now());
    if (!Number.isFinite(now)) return;'''
          if source.count(schedule_anchor) != 1:
              raise SystemExit(f'schedule anchor count: {source.count(schedule_anchor)}')
          if source.count(advance_anchor) != 1:
              raise SystemExit(f'advance anchor count: {source.count(advance_anchor)}')
          source = source.replace(schedule_anchor, schedule_replacement)
          source = source.replace(advance_anchor, advance_replacement)
          path.write_text(source)
          PY

      - name: Run full regression suite
        run: |
          node --check binance-clock.js
          node --check chart.js
          node --check orderbook.js
          node --check app.js
          node --test test-*.mjs

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart.js test-*.mjs
          git commit -m "Refresh Tape minute boundary contracts"
          git push origin HEAD:fix/tape-live-edge-minute-boundary-v1
