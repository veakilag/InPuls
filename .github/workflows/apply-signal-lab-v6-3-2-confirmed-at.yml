name: Apply Signal Lab V6.3.2 confirmedAt propagation

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v6
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply V6.3.2 confirmedAt propagation fix
        run: python3 .github/scripts/apply_signal_lab_v6_3_2_confirmed_at.py

      - name: Remove temporary apply machinery
        run: |
          rm -f .github/scripts/apply_signal_lab_v6_3_2_confirmed_at.py
          rm -f .github/workflows/apply-signal-lab-v6-3-2-confirmed-at.yml

      - name: Validate syntax and focused tests
        run: |
          node --check signal-lab-v7-multi-timeframe-levels.js
          node --check signal-lab-v8-level-context.js
          node --test test/signal-lab-v7-multi-timeframe-levels.test.js test/signal-lab-v8-level-context.test.js
          python3 - <<'PY'
          from pathlib import Path
          levels = Path('signal-lab-v7-multi-timeframe-levels.js').read_text()
          tests = Path('test/signal-lab-v7-multi-timeframe-levels.test.js').read_text()
          assert 'confirmedAt: finite(extreme.confirmedAt)' in levels
          assert 'normalized structural level preserves confirmedAt for causal downstream research' in tests
          assert not Path('.github/scripts/apply_signal_lab_v6_3_2_confirmed_at.py').exists()
          assert not Path('.github/workflows/apply-signal-lab-v6-3-2-confirmed-at.yml').exists()
          PY
          git diff --check

      - name: Run structural regression set
        run: |
          node --test \
            test/signal-lab-v7-multi-timeframe-levels.test.js \
            test/signal-lab-v7-attack-count-runtime.test.js \
            test/signal-lab-v7-pierce-lifecycle.test.js \
            test/signal-lab-v7-tradable-structure-v5.test.js \
            test/signal-lab-v7-vshape-shadow-metrics.test.js \
            test/signal-lab-v7-review-generation.test.js \
            test/signal-lab-v7-no-resurrection.test.js \
            test/signal-lab-v8-level-context.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V6.3.2 propagation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git ls-files --error-unmatch .github/scripts/apply_signal_lab_v6_3_2_confirmed_at.py >/dev/null 2>&1; then
            echo "temporary patch script is still tracked after staging deletions" >&2
            exit 1
          fi
          if git ls-files --error-unmatch .github/workflows/apply-signal-lab-v6-3-2-confirmed-at.yml >/dev/null 2>&1; then
            echo "temporary workflow is still tracked after staging deletions" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 1
          fi
          git commit -m "Preserve structural confirmedAt in level map"
          git push origin agent/signal-lab-structural-extremes-stage1
