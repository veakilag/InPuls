name: Apply Signal Lab V4.4 recall-first detector

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v4-4-recall-first-detector.py
      - .github/workflows/apply-signal-lab-v4-4-recall-first-detector.yml

permissions:
  contents: write

concurrency:
  group: signal-lab-v4-4-recall-first-detector
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply V4.4 recall-first detector patch
        run: python3 scripts/apply-signal-lab-v4-4-recall-first-detector.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary diagnostics and apply machinery
        run: |
          rm -f .github/workflows/diagnose-signal-lab-detector-gate.yml
          rm -f scripts/apply-signal-lab-v4-4-recall-first-detector.py
          rm -f .github/workflows/apply-signal-lab-v4-4-recall-first-detector.yml
          rm -rf scripts/__pycache__

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-v7-multi-timeframe-levels.js
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          node --check signal-lab-v7-structural-extremes.js
          git diff --check

      - name: Test V4.4 review generation
        run: node --test test/signal-lab-v7-review-generation.test.js

      - name: Test adaptive hierarchy
        run: node --test test/signal-lab-v7-adaptive-hierarchy.test.js

      - name: Test multi-timeframe levels
        run: node --test test/signal-lab-v7-multi-timeframe-levels.test.js

      - name: Test pierce lifecycle
        run: node --test test/signal-lab-v7-pierce-lifecycle.test.js

      - name: Test structural detector
        run: node --test test/signal-lab-v7-structural-extremes.test.js

      - name: Test isolation
        run: node --test test/signal-lab-v7-structural-extremes-isolation.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V4.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Separate structural event generation from admission V4.4"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
