name: Apply Runtime Stability v1

on:
  push:
    branches:
      - agent/runtime-stability-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write transformer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("/tmp/apply-runtime-stability-v1.py").write_bytes(
            base64.b64decode("")
          )
          PY

      - name: Apply Runtime Stability
        run: python /tmp/apply-runtime-stability-v1.py

      - name: Validate JavaScript
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < orderbook.js
          node --check orderbook-worker.js
          node --check orderbook-flow-workspace.js
          node --check orderbook-tape-latency.js
          node --check sw.js
          node --check test-orderbook-runtime-stability.mjs

      - name: Run orderbook tests
        run: node --test test-orderbook-*.mjs

      - name: Commit Runtime Stability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Add Runtime Stability v1"
          git push
