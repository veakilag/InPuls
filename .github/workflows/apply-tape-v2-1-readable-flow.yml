      - name: Update module identity test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("test-orderbook-background-depth.mjs")
          source = path.read_text(encoding="utf-8")
          old = '  assert.match(runtime, /^export function applyDepthUpdates/);'
          new = '''  assert.match(runtime, /^import \\{/);
            assert.match(runtime, /export function applyDepthUpdates/);'''
          count = source.count(old)
          if count != 1:
              raise RuntimeError(f"Expected one runtime identity assertion, got {count}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

