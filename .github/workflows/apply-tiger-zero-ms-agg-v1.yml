name: Apply Tiger zero-ms AGG source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/tiger-zero-ms-raw-agg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align generator with current reset points
        run: |
          sed -i 's/!= 3:/!= 4:/' .github/scripts/apply-tiger-zero-ms-agg-v1.py
          sed -i 's/expected 3/expected 4/' .github/scripts/apply-tiger-zero-ms-agg-v1.py
      - name: Apply Tiger zero-ms AGG source
        run: python .github/scripts/apply-tiger-zero-ms-agg-v1.py
      - name: Align guard boundary and legacy contracts
        run: python .github/scripts/update-tiger-zero-ms-contracts-v1.py
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-worker.js
          node --check app.js
          node --check test-tiger-zero-ms-agg-source-v1.mjs
          node --check test-orderbook-guarded-raw-tape.mjs
          node --check test-orderbook-tape-latency.mjs
          node --check test-raw-stability-core.mjs
          node --check test/connection-observability.test.js
          node --check test/orderbook-backpressure.test.js
          node --check test/orderbook-render-scheduler.test.js
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-tiger-zero-ms-agg-v1.py
          rm -f .github/scripts/update-tiger-zero-ms-contracts-v1.py
          rm -f .github/workflows/apply-tiger-zero-ms-agg-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: feed zero-ms AGG from guarded raw trades"
          git push origin HEAD:${{ github.head_ref }}
