name: Algo strategy search fast

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algo-search-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Capture current INPLAY
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { fetchCurrentInPlayUniverse } from "./inplay-universe.js";
          let snapshot;
          try {
            snapshot = await fetchCurrentInPlayUniverse({ limit: 10, rules: { minV24: 100, minNatr1: null, minNatr5: null, minGrowth24: null } });
          } catch (error) {
            snapshot = { capturedAt: Date.now(), matches: [], failed: [{ symbol: "INPLAY", error: error.message }] };
          }
          await writeFile("current-inplay.json", JSON.stringify(snapshot, null, 2));
          await writeFile("current-inplay-symbols.txt", snapshot.matches.map((item) => item.symbol).join("\n"));
          console.log(JSON.stringify({ symbols: snapshot.matches.map((item) => item.symbol), failed: snapshot.failed }, null, 2));
          NODE

      - name: Download January-July official archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive
          core="BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT BNBUSDT"
          inplay="$(tr '\n' ' ' < current-inplay-symbols.txt)"
          universe="$(printf '%s\n' $core $inplay | awk 'NF && !seen[$0]++' | tr '\n' ' ')"
          printf '%s\n' $universe > archive/requested-symbols.txt
          download_symbol() {
            set -euo pipefail
            symbol="$1"
            temp="archive/${symbol}.partial.csv"
            : > "$temp"
            for month in 01 02 03 04 05 06 07; do
              zip="archive/${symbol}-${month}.zip"
              url="https://data.binance.vision/data/futures/um/monthly/klines/${symbol}/1m/${symbol}-1m-2026-${month}.zip"
              if ! curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors "$url" -o "$zip"; then
                rm -f "$temp" "$zip"
                echo "Skip ${symbol}: incomplete history" >&2
                return 0
              fi
              unzip -p "$zip" >> "$temp"
              rm -f "$zip"
            done
            mv "$temp" "archive/${symbol}.csv"
            printf '%s=archive/%s.csv\n' "$symbol" "$symbol" > "archive/${symbol}.input"
          }
          export -f download_symbol
          printf '%s\n' $universe | xargs -r -n1 -P4 bash -c 'download_symbol "$1"' _
          find archive -maxdepth 1 -name '*.input' -print0 | sort -z | xargs -0 cat > archive/inputs.txt
          for required in BTCUSDT ETHUSDT SOLUSDT XRPUSDT; do
            grep -q "^${required}=" archive/inputs.txt || { echo "Missing ${required}" >&2; exit 1; }
          done
          cat archive/inputs.txt

      - name: Search 224 five-minute variants
        shell: bash
        run: |
          set -euo pipefail
          inputs="$(paste -sd, archive/inputs.txt)"
          node algo-strategy-search-fast.mjs \
            --inputs "$inputs" \
            --selection-symbols BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT \
            | tee algo-strategy-search-fast-result.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: algo-strategy-search-fast-${{ github.run_id }}
          path: |
            algo-strategy-search-fast-result.json
            current-inplay.json
            archive/inputs.txt
            archive/requested-symbols.txt
          if-no-files-found: warn
          retention-days: 14
