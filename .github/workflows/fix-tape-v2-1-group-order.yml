name: Fix Tape v2.1 group order

on:
  push:
    branches:
      - agent/tape-v2-1-readable-flow

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep local groups chronological
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          layout_path = Path("orderbook-tape-layout.js")
          test_path = Path("test-orderbook-tape-v2-readable-flow.mjs")
          workflow_path = Path(".github/workflows/fix-tape-v2-1-group-order.yml")

          layout = layout_path.read_text(encoding="utf-8")
          replacement = r'''export function buildReadableTapeLayout(items, window, width) {
            const safeWidth = Math.max(1, Number(width) || 1);
            const leftEdge = 1;
            const rightEdge = Math.max(
              leftEdge,
              Math.min(Number(window?.plotRight) || safeWidth, safeWidth) - 1,
            );
            const ordered = (items ?? [])
              .map((item, sequenceIndex) => ({
                ...item,
                sequenceIndex,
                baseX: timeToX(item.lastTime ?? item.time, window, safeWidth),
              }))
              .sort((left, right) => (
                Number(left.lastTime ?? left.time) - Number(right.lastTime ?? right.time)
                || left.sequenceIndex - right.sequenceIndex
              ));
            if (!ordered.length) return [];

            const groups = splitCollisionGroups(ordered);
            const ranges = groups.map((group) => ({
              start: group[0].baseX,
              end: group.at(-1).baseX,
            }));
            const laidOut = [];

            groups.forEach((group, groupIndex) => {
              const density = group.length;
              const naturalStart = ranges[groupIndex].start;
              const naturalEnd = ranges[groupIndex].end;
              const naturalSpan = Math.max(0, naturalEnd - naturalStart);
              const previous = ranges[groupIndex - 1];
              const next = ranges[groupIndex + 1];
              const leftBoundary = previous
                ? (previous.end + naturalStart) / 2
                : leftEdge;
              const rightBoundary = next
                ? (naturalEnd + next.start) / 2
                : rightEdge;
              const availableLeft = Math.max(0, naturalStart - leftBoundary);
              const availableRight = Math.max(0, rightBoundary - naturalEnd);
              const desiredGap = density > 1
                ? Math.min(2.2, TAPE_READABLE_LAYOUT.maxExtraSpanPx / (density - 1))
                : 0;
              const desiredSpan = Math.max(
                naturalSpan,
                desiredGap * Math.max(0, density - 1),
              );
              const requestedExtra = Math.min(
                TAPE_READABLE_LAYOUT.maxExtraSpanPx,
                Math.max(0, desiredSpan - naturalSpan),
              );
              const extraSpan = Math.min(
                requestedExtra,
                availableLeft + availableRight,
              );

              let leftExpansion = Math.min(availableLeft, extraSpan / 2);
              let rightExpansion = Math.min(
                availableRight,
                extraSpan - leftExpansion,
              );
              let remaining = extraSpan - leftExpansion - rightExpansion;
              if (remaining > 0) {
                const addLeft = Math.min(
                  availableLeft - leftExpansion,
                  remaining,
                );
                leftExpansion += addLeft;
                remaining -= addLeft;
              }
              if (remaining > 0) {
                rightExpansion += Math.min(
                  availableRight - rightExpansion,
                  remaining,
                );
              }
              const distributedExtra = leftExpansion + rightExpansion;

              group.forEach((item, index) => {
                const progress = density > 1 ? index / (density - 1) : 0;
                const x = clamp(
                  item.baseX - leftExpansion + distributedExtra * progress,
                  leftEdge,
                  rightEdge,
                );
                const yOffset = density >= 24
                  ? [-0.8, 0, 0.8][index % 3]
                  : density >= 10
                    ? [-0.45, 0.45][index % 2]
                    : 0;
                const { sequenceIndex, ...rest } = item;
                laidOut.push({ ...rest, x, density, yOffset });
              });
            });

            return laidOut;
          }'''

          pattern = (
              r"export function buildReadableTapeLayout\(items, window, width\) \{"
              r".*?\n\}\n\nexport function adaptiveRawDiameter"
          )
          layout, count = re.subn(
              pattern,
              replacement + "\n\nexport function adaptiveRawDiameter",
              layout,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError(f"Expected one layout function, got {count}")
          layout_path.write_text(layout, encoding="utf-8")

          tests = test_path.read_text(encoding="utf-8")
          anchor = "test('dense raw dots shrink while large sparse dots stay visible', () => {"
          new_test = r'''test('neighboring dense groups never cross chronological order', () => {
            const window = windowFor(500);
            const timeAtX = (x) => (
              window.startTime + x / window.plotRight * window.duration
            );
            const first = Array.from(
              { length: 20 },
              (_, id) => ({ id, time: timeAtX(100) }),
            );
            const second = Array.from(
              { length: 20 },
              (_, index) => ({ id: 20 + index, time: timeAtX(104) }),
            );
            const laid = buildReadableTapeLayout([...first, ...second], window, 500);
            const firstEnd = Math.max(...laid.slice(0, 20).map((item) => item.x));
            const secondStart = Math.min(...laid.slice(20).map((item) => item.x));
            assert.ok(firstEnd <= secondStart + 1e-9);
            for (let index = 1; index < laid.length; index += 1) {
              assert.ok(laid[index].x >= laid[index - 1].x);
            }
          });

          '''
          if tests.count(anchor) != 1:
              raise RuntimeError(
                  f"Expected one readable-flow test anchor, got {tests.count(anchor)}"
              )
          tests = tests.replace(anchor, new_test + anchor, 1)
          test_path.write_text(tests, encoding="utf-8")

          workflow_path.unlink(missing_ok=True)
          PY

      - name: Validate JavaScript
        run: |
          node --check orderbook-tape-layout.js
          node --check test-orderbook-tape-v2-readable-flow.mjs

      - name: Run orderbook tests
        run: node --test test-orderbook-*.mjs

      - name: Commit group order fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Keep Tape groups chronological"
          git push
