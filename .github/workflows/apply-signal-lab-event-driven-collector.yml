name: Apply Signal Lab event-driven collector

on:
  push:
    branches:
      - fix/signal-lab-event-driven-collector
    paths:
      - .github/workflows/apply-signal-lab-event-driven-collector.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/signal-lab-event-driven-collector
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply focused patch
        run: node tools/apply-signal-lab-event-driven-collector-v2.mjs
      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run full test suite
        run: npm test
      - name: Commit verified runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-signal-lab-event-driven-collector.yml
          git rm tools/apply-signal-lab-event-driven-collector.mjs
          git rm tools/apply-signal-lab-event-driven-collector-v2.mjs
          git add app.js owner-signal-lab-v2.js owner-signal-lab.html sw.js test/signal-lab-collector-status.test.js
          git commit -m "Fix Signal Lab collection in background tabs"
          git push origin HEAD:fix/signal-lab-event-driven-collector
