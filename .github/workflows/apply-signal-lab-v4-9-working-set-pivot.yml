name: Apply Signal Lab V4.9 working-set pivot filter

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v4-9-working-set-pivot.py
      - .github/workflows/apply-signal-lab-v4-9-working-set-pivot.yml

permissions:
  contents: write

concurrency:
  group: signal-lab-v4-9-working-set-pivot
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply V4.9 working-set pivot patch
        run: python3 scripts/apply-signal-lab-v4-9-working-set-pivot.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v4-9-working-set-pivot.py
          rm -f .github/workflows/apply-signal-lab-v4-9-working-set-pivot.yml
          rm -rf scripts/__pycache__

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-v7-multi-timeframe-levels.js
          git diff --check

      - name: Test V4.9 working-set pivot quality
        run: node --test test/signal-lab-v7-working-set-pivot.test.js

      - name: Test V4.8 pivot retracement
        run: node --test test/signal-lab-v7-pivot-retracement.test.js

      - name: Test V4.7 pivot prominence
        run: node --test test/signal-lab-v7-pivot-prominence.test.js

      - name: Test V4.6 local frontier
        run: node --test test/signal-lab-v7-local-frontier.test.js

      - name: Test V4.5 working map and takeout
        run: node --test test/signal-lab-v7-working-map-takeout.test.js

      - name: Test V4.4 review generation
        run: node --test test/signal-lab-v7-review-generation.test.js

      - name: Test adaptive hierarchy
        run: node --test test/signal-lab-v7-adaptive-hierarchy.test.js

      - name: Test multi-timeframe levels
        run: node --test test/signal-lab-v7-multi-timeframe-levels.test.js

      - name: Test pierce lifecycle
        run: node --test test/signal-lab-v7-pierce-lifecycle.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V4.9
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Filter shallow local LOWs in working map V4.9"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
