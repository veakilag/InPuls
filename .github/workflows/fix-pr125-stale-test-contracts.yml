name: Fix PR125 stale test contracts

on:
  push:
    branches:
      - fix/tape-live-edge-minute-boundary-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/tape-live-edge-minute-boundary-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh release-key contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = '26-102-tape-live-edge-minute-boundary-v1'
          replacements = {
              '26-101-binance-clock-sync-v1': build,
              '26-97-smooth-chart-first-v1': build,
          }

          targets = list(Path('.').glob('test-*.mjs')) + list(Path('test').rglob('*.js'))
          for path in targets:
              source = path.read_text()
              updated = source
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.name == 'test-binance-clock-sync-v1.mjs':
                  old = '  assert.match(clock, /canvas-comfort-preview\\.js\\?v=26-102-tape-edge-canvas-preview-v1/);'
                  new = (
                      '  assert.doesNotMatch(clock, /canvas-comfort-preview\\.js/, '
                      '"clock must not load UI preview as a side effect");\n'
                      '  assert.match(index, /canvas-comfort-preview\\.js\\?v=26-102-tape-live-edge-minute-boundary-v1/);'
                  )
                  if old not in updated:
                      raise SystemExit('clock Canvas-preview assertion anchor not found')
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated)
          PY

      - name: Run complete regression and syntax checks
        run: |
          node --check binance-clock.js
          node --check chart.js
          node --check orderbook.js
          node --check app.js
          node --test test-*.mjs test/*.js

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-pr125-stale-test-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-*.mjs test/*.js .github/workflows/fix-pr125-stale-test-contracts.yml
          git commit -m "Refresh PR125 release-key test contracts"
          git push origin HEAD:fix/tape-live-edge-minute-boundary-v1
