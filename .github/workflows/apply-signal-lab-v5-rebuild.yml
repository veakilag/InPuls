name: Apply Signal Lab V5 rebuild

on:
  push:
    branches:
      - agent/signal-lab-v5-rebuild-orderbook-candles

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v5-rebuild-applied]') && !contains(github.event.head_commit.message, '[signal-lab-v5-rebuild-log]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v5-rebuild-orderbook-candles
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply V5 rebuild
        run: python scripts/patch-signal-lab-v5-rebuild.py

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: |
          set +e
          npm test > /tmp/signal-lab-v5-tests.log 2>&1
          code=$?
          cat /tmp/signal-lab-v5-tests.log
          echo "TEST_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Publish regression failure
        if: env.TEST_EXIT != '0'
        run: |
          cp /tmp/signal-lab-v5-tests.log V5_REBUILD_TEST_FAILURE.txt
          grep -n -E '^(not ok|# fail|# pass|# tests)' /tmp/signal-lab-v5-tests.log > V5_REBUILD_FAILURE_SUMMARY.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V5_REBUILD_TEST_FAILURE.txt V5_REBUILD_FAILURE_SUMMARY.txt
          git commit -m "Capture Signal Lab V5 rebuild failure [signal-lab-v5-rebuild-log]"
          git push origin HEAD:agent/signal-lab-v5-rebuild-orderbook-candles
          exit 1

      - name: Commit clean V5 rebuild
        if: env.TEST_EXIT == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-signal-lab-v5-rebuild.yml scripts/patch-signal-lab-v5-rebuild.py
          git add orderbook.js signal-lab-v3-candidates.js signal-lab-v3-full-chart.js signal-lab-v4-orderflow-recorder.js signal-lab-v3-evidence.js signal-lab-v3-replay-ui.js signal-lab-v4-orderflow-replay.js signal-lab-v5-orderbook.css owner-signal-lab-v3.html owner-signal-lab-v3.js signal-lab-v3-collector.js test/signal-lab-v5-rebuild.test.js docs/signal-lab-v5-rebuild.md
          git commit -m "Rebuild Signal Lab V5 candles and shared orderbook Replay [signal-lab-v5-rebuild-applied]"
          git push origin HEAD:agent/signal-lab-v5-rebuild-orderbook-candles
