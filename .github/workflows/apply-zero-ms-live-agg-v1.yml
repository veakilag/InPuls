name: Apply zero-ms live AGG

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/zero-ms-live-agg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply zero-ms live AGG
        run: python .github/scripts/apply-zero-ms-live-agg-v1.py
      - name: Align legacy updater guards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/update-zero-ms-tests-v1.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''for path in [
              "test-orderbook-tape-v2-core.mjs",
              "test-tape-cluster-lifecycle-v1.mjs",
              "test-tape-stability-followup-v1.mjs",
          ]:
              text = read(path)
              assert "TAPE_AGGREGATION_LEVELS" not in text
              assert "aggregateTapeBuckets" not in text
          ''', '')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Update legacy Tape contracts
        run: python .github/scripts/update-zero-ms-tests-v1.py
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check app.js
          node --check test-sealed-agg-round-levels-v1.mjs
          node --check test-orderbook-tape-v2-core.mjs
          node --check test-tape-cluster-lifecycle-v1.mjs
          node --check test-tape-stability-followup-v1.mjs
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-zero-ms-live-agg-v1.py
          rm -f .github/scripts/update-zero-ms-tests-v1.py
          rm -f .github/workflows/apply-zero-ms-live-agg-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: implement zero-ms live AGG"
          git push origin HEAD:${{ github.head_ref }}
