name: Diagnose Signal Lab detector gate

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - .github/workflows/diagnose-signal-lab-detector-gate.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Replay real BTC/HFT 5m candles through detector gates
        env:
          END_AT: "1786100160000"
        run: |
          node --input-type=module <<'NODE'
          import { StructuralExtremeEngine } from './signal-lab-v7-structural-extremes.js';

          const END_AT = Number(process.env.END_AT);
          const INTERVAL = '5m';
          const WINDOW_MS = 10 * 60 * 60_000;
          const START_AT = END_AT - 30 * 60 * 60_000;

          async function json(url) {
            const response = await fetch(url, { headers: { 'user-agent': 'InPuls-Signal-Lab-Diagnostics/1.0' } });
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${await response.text()}`);
            return response.json();
          }

          async function tickSize(symbol) {
            const data = await json(`https://fapi.binance.com/fapi/v1/exchangeInfo?symbol=${symbol}`);
            const row = data.symbols?.find((item) => item.symbol === symbol);
            const priceFilter = row?.filters?.find((item) => item.filterType === 'PRICE_FILTER');
            const value = Number(priceFilter?.tickSize);
            if (!(value > 0)) throw new Error(`Missing tick size for ${symbol}`);
            return value;
          }

          async function candles(symbol) {
            const url = new URL('https://fapi.binance.com/fapi/v1/klines');
            url.searchParams.set('symbol', symbol);
            url.searchParams.set('interval', INTERVAL);
            url.searchParams.set('startTime', String(START_AT));
            url.searchParams.set('endTime', String(END_AT));
            url.searchParams.set('limit', '1000');
            const rows = await json(url);
            return rows.map((row) => ({
              time: Number(row[0]),
              open: Number(row[1]),
              high: Number(row[2]),
              low: Number(row[3]),
              close: Number(row[4]),
              volume: Number(row[5]),
              closeTime: Number(row[6]),
              closed: true,
            }));
          }

          const configs = [
            ['DEFAULT', {}],
            ['MIN_SWING_018', { minimumSwingPercent: 0.18 }],
            ['REVERSAL_ATR_050', { atrMultiplier: 0.50 }],
            ['MIN018_ATR050', { minimumSwingPercent: 0.18, atrMultiplier: 0.50 }],
            ['GEOMETRY_018', { minimumSwingPercent: 0.18, atrMultiplier: 0, minimumPercent: 0.18 }],
            ['GEOMETRY_012', { minimumSwingPercent: 0.12, atrMultiplier: 0, minimumPercent: 0.12 }],
          ];

          function iso(ms) { return new Date(ms).toISOString().replace('.000Z', 'Z'); }

          for (const symbol of ['BTCUSDT', 'HFTUSDT']) {
            const tick = await tickSize(symbol);
            const rows = await candles(symbol);
            console.log(`\n========== ${symbol} tick=${tick} candles=${rows.length} ${iso(rows[0].time)} .. ${iso(rows.at(-1).closeTime)} ==========`);

            for (const [name, config] of configs) {
              const engine = new StructuralExtremeEngine({ symbol, timeframe: '5m', tickSize: tick, config });
              const diagnostics = [];
              let priorConfirmed = 0;
              let priorCandidateKey = null;

              for (const candle of rows) {
                const snap = engine.ingestCandle(candle);
                const candidate = snap.candidate;
                const candidateKey = candidate ? `${candidate.side}:${candidate.extremeAt}:${candidate.price}` : null;
                const confirmed = snap.history.length;
                const recent = candle.time >= END_AT - WINDOW_MS;
                if (recent && (
                  confirmed !== priorConfirmed
                  || candidateKey !== priorCandidateKey
                  || /SWING_AMPLITUDE_TOO_SMALL|REVERSAL_BELOW_THRESHOLD/.test(snap.diagnostics?.reason ?? '')
                )) {
                  diagnostics.push({
                    at: iso(candle.closeTime),
                    reason: snap.diagnostics?.reason,
                    direction: snap.direction,
                    candidateSide: candidate?.side ?? null,
                    candidatePrice: candidate?.price ?? null,
                    candidateAt: candidate?.extremeAt ? iso(candidate.extremeAt) : null,
                    swing: snap.diagnostics?.swingAmplitudePct ?? null,
                    reversal: snap.diagnostics?.confirmingReversalPct ?? null,
                    required: snap.diagnostics?.requiredReversalPct ?? null,
                    confirmed,
                  });
                }
                priorConfirmed = confirmed;
                priorCandidateKey = candidateKey;
              }

              const snap = engine.snapshot();
              const recentExtremes = snap.history
                .filter((row) => row.extremeAt >= END_AT - WINDOW_MS)
                .map((row) => ({
                  side: row.side,
                  price: row.price,
                  extremeAt: iso(row.extremeAt),
                  confirmedAt: iso(row.confirmedAt),
                  swing: row.swingAmplitudePct,
                  reversal: row.confirmingReversalPct,
                  threshold: row.reversalThresholdPct,
                  active: row.active,
                  status: row.status,
                }));
              const highs = recentExtremes.filter((row) => row.side === 'HIGH');
              const lows = recentExtremes.filter((row) => row.side === 'LOW');

              console.log(`\n--- ${symbol} ${name} ---`);
              console.log(`recent extremes: highs=${highs.length} lows=${lows.length}`);
              console.log('HIGHS', JSON.stringify(highs, null, 2));
              console.log('LOWS', JSON.stringify(lows, null, 2));
              console.log('GATE_DIAGNOSTICS', JSON.stringify(diagnostics, null, 2));
            }
          }
          NODE
