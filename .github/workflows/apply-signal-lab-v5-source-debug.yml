name: Apply Signal Lab V5 source qualification debug

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v5-source-debug.py
      - .github/workflows/apply-signal-lab-v5-source-debug.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Apply V5 source debug
        run: python3 scripts/apply-signal-lab-v5-source-debug.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v5-source-debug.py
          rm -f .github/workflows/apply-signal-lab-v5-source-debug.yml

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          git diff --check

      - name: Run structural regression set
        run: |
          node --test test/signal-lab-v7-tradable-structure-v5.test.js test/signal-lab-v7-multi-timeframe-levels.test.js test/signal-lab-v7-structural-extremes-v3.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V5 source debug
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add V5 source qualification diagnostics"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
