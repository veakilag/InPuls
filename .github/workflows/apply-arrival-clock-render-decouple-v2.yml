name: Apply arrival clock render decouple v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/arrival-clock-no-global-render-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply clean implementation
        run: python tools/apply_arrival_clock_render_decouple_v2.py

      - name: Syntax checks
        run: |
          node --check app.js
          node --check orderbook.js
          node --check orderbook-worker.js
          node --check test-arrival-clock-render-decouple-v1.mjs

      - name: Focused Tape regressions
        run: |
          node --test \
            test-arrival-clock-render-decouple-v1.mjs \
            test-sweep-tape-clock-v1.mjs \
            test-tape-stability-followup-v1.mjs \
            test-sealed-agg-round-levels-v1.mjs

      - name: Full test suite with compact failure output
        run: |
          set +e
          npm test > /tmp/inpuls-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== FAILURES ==="
            grep -n -E "not ok|failureType|error:|Expected values|actual:|expected:|location:" /tmp/inpuls-test.log | tail -n 160 || true
            echo "=== LOG TAIL ==="
            tail -n 100 /tmp/inpuls-test.log
          else
            grep -E "# tests |# pass |# fail |# duration_ms" /tmp/inpuls-test.log | tail -n 8
          fi
          exit "$status"

      - name: Remove all patch scaffolding
        run: |
          rm -f tools/apply_arrival_clock_no_global_render_v1.py
          rm -f tools/apply_arrival_clock_render_decouple_v2.py
          rm -f .github/workflows/apply-arrival-clock-no-global-render-v1.yml
          rm -f .github/workflows/apply-arrival-clock-render-decouple-v2.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use arrival time for live Tape and decouple market renders"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
