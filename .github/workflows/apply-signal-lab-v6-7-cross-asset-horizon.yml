name: Apply Signal Lab V6.7 cross-asset horizon

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v6
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply V6.7 cross-asset horizon research layer
        run: python3 scripts/apply-signal-lab-v6-7-cross-asset-horizon.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v6-7-cross-asset-horizon.py
          rm -f .github/workflows/apply-signal-lab-v6-7-cross-asset-horizon.yml

      - name: Validate syntax and focused V6.7 tests
        run: |
          node --check signal-lab-v8-level-context.js
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          node --test test/signal-lab-v8-level-context.test.js
          python3 - <<'PY'
          from pathlib import Path
          context = Path('signal-lab-v8-level-context.js').read_text()
          runtime = Path('signal-lab-v7-multi-timeframe-review-runtime.js').read_text()
          tests = Path('test/signal-lab-v8-level-context.test.js').read_text()
          assert 'v6.7-cross-asset-horizon-zones-shadow-2026-08' in context
          assert 'buildCrossAssetHorizonResearchContext' in context
          assert '5% cascade envelope preserved' in runtime
          assert 'RESEARCH SNAPSHOT v6.7-cross-asset-compact-2026-08' in runtime
          assert 'V6.7 low-volatility asset keeps 5% cascade envelope' in tests
          assert not Path('scripts/apply-signal-lab-v6-7-cross-asset-horizon.py').exists()
          assert not Path('.github/workflows/apply-signal-lab-v6-7-cross-asset-horizon.yml').exists()
          PY
          git diff --check

      - name: Run structural regression set
        run: |
          node --test \
            test/signal-lab-v7-multi-timeframe-levels.test.js \
            test/signal-lab-v7-attack-count-runtime.test.js \
            test/signal-lab-v7-pierce-lifecycle.test.js \
            test/signal-lab-v7-tradable-structure-v5.test.js \
            test/signal-lab-v7-vshape-shadow-metrics.test.js \
            test/signal-lab-v7-review-generation.test.js \
            test/signal-lab-v7-no-resurrection.test.js \
            test/signal-lab-v8-level-context.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V6.7 cross-asset research layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git ls-files --error-unmatch scripts/apply-signal-lab-v6-7-cross-asset-horizon.py >/dev/null 2>&1; then
            echo "temporary patch script still tracked" >&2
            exit 1
          fi
          if git ls-files --error-unmatch .github/workflows/apply-signal-lab-v6-7-cross-asset-horizon.yml >/dev/null 2>&1; then
            echo "temporary workflow still tracked" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 1
          fi
          git commit -m "Add V6.7 cross-asset horizon research"
          git push origin agent/signal-lab-structural-extremes-stage1
