name: Apply market feed footprint series

on:
  push:
    branches:
      - fix/market-feed-footprint-series-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/market-feed-footprint-series-v1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply update
        run: python .github/scripts/apply-market-feed-footprint-series-v1.py

      - name: Syntax checks
        run: |
          node --check app.js
          node --check orderbook.js
          node --check orderbook-flow-workspace.js

      - name: Focused regressions
        run: |
          node --test test-market-feed-footprint-series-v1.mjs
          node --test test-sweep-tape-clock-v1.mjs
          node --test test-footprint-live-source-v1.mjs
          node --test test-global-connection-radar-cleanup-v1.mjs

      - name: Full test suite
        run: npm test

      - name: Commit verified implementation
        run: |
          git rm .github/scripts/apply-market-feed-footprint-series-v1.py
          git rm .github/workflows/apply-market-feed-footprint-series-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix market feed, footprint POC and 100ms Series"
          git push origin HEAD:fix/market-feed-footprint-series-v1
