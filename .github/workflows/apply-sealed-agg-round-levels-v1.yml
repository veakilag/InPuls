name: Apply sealed AGG and round levels

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/sealed-agg-round-levels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align generator with both reset indentations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-sealed-agg-round-levels-v1.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if reset_count != 2:', 'if reset_count != 1:', 1)
          text = text.replace('symbol/replace AGG reset blocks: expected 2, found', 'symbol/replace AGG reset blocks: expected 1, found', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply sealed AGG and round-level fix
        run: python .github/scripts/apply-sealed-agg-round-levels-v1.py
      - name: Complete the second AGG reset block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('orderbook.js')
          text = path.read_text(encoding='utf-8')
          old = '''        state.rawRenderNodes = [];
        state.aggSourceBuckets = [];
        state.aggSnapshots?.clear?.();
'''
          new = '''        state.rawRenderNodes = [];
        state.aggSourceBuckets = [];
        state.aggBaseTick = null;
        state.aggBaseTickSymbol = null;
        state.aggSnapshots?.clear?.();
'''
          count = text.count(old)
          if count != 1:
              raise AssertionError(f'second AGG reset: expected 1, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check app.js
          node --check test-sealed-agg-round-levels-v1.mjs
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-sealed-agg-round-levels-v1.py
          rm -f .github/workflows/apply-sealed-agg-round-levels-v1.yml
          rm -f .github/trigger-sealed-agg-round-levels-v1.txt
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: seal AGG and stabilize round levels"
          git push origin HEAD:${{ github.head_ref }}
