name: Apply structural review timeframe and eraser fixes

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-structural-review-timeframe-eraser.py
      - .github/workflows/apply-structural-review-timeframe-eraser.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply fixes
        run: python3 scripts/apply-structural-review-timeframe-eraser.py

      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-structural-review-timeframe-eraser.py
          rm -f .github/workflows/apply-structural-review-timeframe-eraser.yml
          rm -f .github/workflows/validate-structural-review-tools.yml

      - name: Validate syntax and diff
        run: |
          node --check chart.js
          node --check owner-signal-lab-structural-extremes-review.js
          node --check signal-lab-v7-structural-extremes.js
          git diff --check

      - name: Run focused chart and review tests
        run: node --test test/chart.test.js test/signal-lab-v7-structural-extremes-isolation.test.js test/signal-lab-v7-structural-extremes.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix candle timeframe slots, 1m loading and review eraser"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
