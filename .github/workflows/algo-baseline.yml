name: Algo Lab live baseline

on:
  workflow_dispatch:
  push:
    branches:
      - feature/algo-backtest-v1
    paths:
      - algo-backtest.js
      - binance-history.js
      - inplay-universe.js
      - algo-universe-backtest.mjs
      - .github/workflows/algo-baseline.yml

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 7-day 1-minute baseline
        run: |
          set -o pipefail
          node algo-universe-backtest.mjs \
            --interval 1m \
            --days 7 \
            --inplay-limit 12 \
            --min-v24 100 \
            --concurrency 2 > algo-baseline.json
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('algo-baseline.json', 'utf8'));
          console.log(JSON.stringify({
            capturedAt: report.selection.capturedAt,
            currentInPlaySymbols: report.selection.currentInPlaySymbols,
            summary: report.summary,
            top: report.results.slice(0, 10).map(({ symbol, source, test }) => ({ symbol, source, ...test })),
            failures: report.failures,
          }, null, 2));
          NODE
      - name: Upload full baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algo-baseline-${{ github.run_id }}
          path: algo-baseline.json
          if-no-files-found: warn
          retention-days: 7
