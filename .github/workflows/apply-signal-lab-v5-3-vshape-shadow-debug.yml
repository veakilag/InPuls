name: Apply Signal Lab V5.3 V-shape shadow diagnostics

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v5-3-vshape-shadow-debug.py
      - .github/workflows/apply-signal-lab-v5-3-vshape-shadow-debug.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Apply V5.3 shadow metrics
        run: python3 scripts/apply-signal-lab-v5-3-vshape-shadow-debug.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v5-3-vshape-shadow-debug.py
          rm -f .github/workflows/apply-signal-lab-v5-3-vshape-shadow-debug.yml

      - name: Validate syntax and focused shadow metric tests
        run: |
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          git diff --check
          node --test test/signal-lab-v7-vshape-shadow-metrics.test.js

      - name: Run structural regression set
        run: |
          node --test \
            test/signal-lab-v7-structural-extremes.test.js \
            test/signal-lab-v7-structural-extremes-isolation.test.js \
            test/signal-lab-v7-structural-extremes-v3.test.js \
            test/signal-lab-v7-same-bar-opposite-candidate.test.js \
            test/signal-lab-v7-multi-timeframe-levels.test.js \
            test/signal-lab-v7-adaptive-hierarchy.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V5.3 diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 5m V-shape shadow diagnostics"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
