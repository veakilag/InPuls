name: Fix Tape v2 bounded layout

on:
  push:
    branches:
      - agent/tape-v2-core

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bound RAW collision displacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()
          ORDERBOOK = ROOT / "orderbook.js"
          TEST = ROOT / "test-orderbook-tape-v2-core.mjs"
          WORKFLOW = ROOT / ".github/workflows/fix-tape-v2-bounded-layout.yml"

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one {label} anchor, got {count}")
              return source.replace(old, new, 1)

          orderbook = ORDERBOOK.read_text(encoding="utf-8")
          orderbook = replace_once(
              orderbook,
              '''const TAPE_COLLISION_GAP_PX = 2.4;
          const TAPE_TIMELINE_MIN_LABEL_GAP_PX = 42;''',
              '''const TAPE_COLLISION_GAP_PX = 2.4;
          const TAPE_COLLISION_MAX_SHIFT_PX = 12;
          const TAPE_TIMELINE_MIN_LABEL_GAP_PX = 42;''',
              "collision constants",
          )
          orderbook = replace_once(
              orderbook,
              '''  const available = Math.max(0, rightEdge - leftEdge);
            const gap = ordered.length > 1
              ? Math.min(TAPE_COLLISION_GAP_PX, available / (ordered.length - 1))
              : 0;''',
              '''  const gap = ordered.length > 1
              ? Math.min(
                  TAPE_COLLISION_GAP_PX,
                  TAPE_COLLISION_MAX_SHIFT_PX / (ordered.length - 1),
                )
              : 0;''',
              "collision gap",
          )
          ORDERBOOK.write_text(orderbook, encoding="utf-8")

          test_source = TEST.read_text(encoding="utf-8")
          test_source = replace_once(
              test_source,
              '''globalThis.tapeApi = { buildContinuousTapeWindow, tapeTimeX, layoutTapeSequence, formatTapeClock };''',
              '''globalThis.tapeApi = {
            buildContinuousTapeWindow,
            tapeTimeX,
            layoutTapeSequence,
            formatTapeClock,
            TAPE_COLLISION_MAX_SHIFT_PX,
          };''',
              "test API",
          )
          test_source = replace_once(
              test_source,
              '''  assert.ok(laidOut.every((item) => Number.isFinite(item.x)));
            assert.ok(laidOut[0].x >= 1);
            assert.ok(laidOut.at(-1).x <= window.plotRight + 1e-9);
            for (let index = 1; index < laidOut.length; index += 1) {
              assert.ok(laidOut[index].x >= laidOut[index - 1].x);
            }''',
              '''  assert.ok(laidOut.every((item) => Number.isFinite(item.x)));
            assert.ok(laidOut[0].x >= 1);
            assert.ok(laidOut.at(-1).x <= window.plotRight + 1e-9);
            assert.ok(laidOut.every(
              (item) => Math.abs(item.x - item.baseX) <= api.TAPE_COLLISION_MAX_SHIFT_PX + 1e-9,
            ));
            assert.ok(
              laidOut.at(-1).x - laidOut[0].x <= api.TAPE_COLLISION_MAX_SHIFT_PX + 1e-9,
            );
            for (let index = 1; index < laidOut.length; index += 1) {
              assert.ok(laidOut[index].x >= laidOut[index - 1].x);
            }''',
              "density assertions",
          )
          TEST.write_text(test_source, encoding="utf-8")

          WORKFLOW.unlink(missing_ok=True)
          PY

      - name: Validate JavaScript
        run: |
          node --input-type=module --check < orderbook.js
          node --check test-orderbook-tape-v2-core.mjs

      - name: Run orderbook tests
        run: node --test test-orderbook-*.mjs

      - name: Commit bounded layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Bound Tape v2 collision layout"
          git push
