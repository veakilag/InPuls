name: Apply Signal Lab V6.3 approach context

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v6-3-approach-context.py
      - .github/workflows/apply-signal-lab-v6-3-approach-context.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply V6.3 approach/compression shadow context
        run: python3 scripts/apply-signal-lab-v6-3-approach-context.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary apply machinery
        run: rm scripts/apply-signal-lab-v6-3-approach-context.py .github/workflows/apply-signal-lab-v6-3-approach-context.yml

      - name: Validate syntax and focused V6.3 tests
        run: |
          node --check signal-lab-v8-level-context.js
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          node --test test/signal-lab-v8-level-context.test.js

      - name: Run structural regression set
        run: |
          node --test \
            test/signal-lab-v7-structural-extremes.test.js \
            test/signal-lab-v7-same-bar-opposite-candidate.test.js \
            test/signal-lab-v7-multi-timeframe-levels.test.js \
            test/signal-lab-v7-adaptive-hierarchy.test.js \
            test/signal-lab-v7-pierce-lifecycle.test.js \
            test/signal-lab-v7-tradable-structure-v5.test.js \
            test/signal-lab-v7-vshape-shadow-metrics.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V6.3 shadow layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Expected V6.3 changes but index is clean"; exit 1; }
          git commit -m "Add V6.3 approach compression shadow context"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
