name: Apply structural extrema stage 1 polish

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - .github/workflows/apply-structural-extremes-stage1-polish.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply calibration polish
        run: python3 scripts/apply-structural-extremes-stage1-polish.py

      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-structural-extremes-stage1-polish.py
          rm -f .github/workflows/apply-structural-extremes-stage1-polish.yml

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-v7-structural-extremes.js
          node --check owner-signal-lab-structural-extremes-review.js
          git diff --check

      - name: Run structural tests
        run: node --test test/signal-lab-v7-structural-extremes.test.js test/signal-lab-v7-structural-extremes-isolation.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish structural candidate and crossing semantics"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
