name: Preserve deep multi-book state

on:
  push:
    branches:
      - agent/runtime-stability-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write transformer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("/tmp/fix-runtime-deep-book.py").write_bytes(
            base64.b64decode("")
          )
          PY

      - name: Preserve deep local books
        run: python /tmp/fix-runtime-deep-book.py

      - name: Validate JavaScript
        run: |
          node --check orderbook-worker.js
          node --check test-orderbook-runtime-stability.mjs

      - name: Run orderbook tests
        run: node --test test-orderbook-*.mjs

      - name: Commit deep-book fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Preserve deep multi-book state"
          git push
