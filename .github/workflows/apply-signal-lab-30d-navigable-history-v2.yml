name: Apply Signal Lab navigable 30-day history

on:
  push:
    branches:
      - agent/signal-lab-30d-navigable-history-v2
    paths:
      - .github/workflows/apply-signal-lab-30d-navigable-history-v2.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-30d-navigable-history-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply navigable history patch
        run: python3 scripts/apply-signal-lab-30d-navigable-history-v2.py

      - name: Remove temporary patch runner and workflow
        run: |
          rm -f scripts/apply-signal-lab-30d-navigable-history-v2.py
          rm -f .github/workflows/apply-signal-lab-30d-navigable-history-v2.yml

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-v3-full-chart.js
          node --check signal-lab-chart-modal.js
          node --check owner-signal-lab-v3.js
          node --check scripts/signal-lab-runtime-smoke.mjs
          git diff --check

      - name: Run focused navigation tests
        run: node --test test/signal-lab-30d-navigation.test.js test/signal-lab-modal-chart.test.js test/signal-lab-v3-full-chart.test.js

      - name: Run full test suite
        run: npm test

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep 30 days of episode candles navigable on every timeframe"
          git push origin HEAD:agent/signal-lab-30d-navigable-history-v2
