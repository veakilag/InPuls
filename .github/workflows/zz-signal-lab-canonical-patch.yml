name: Apply Signal Lab canonical structure patch

on:
  push:
    branches: ["fix/signal-lab-canonical-levels-cascades"]

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/signal-lab-canonical-levels-cascades
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 scripts/apply-signal-lab-canonical-patch.py

      - name: Run complete test suite
        run: npm test

      - name: Commit canonical structure fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix canonical multi-timeframe levels and cascade noise"
          git push origin HEAD:fix/signal-lab-canonical-levels-cascades
