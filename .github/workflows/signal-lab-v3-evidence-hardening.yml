name: Harden Signal Lab V3 evidence replay

on:
  push:
    branches:
      - agent/signal-lab-v3-evidence-replay

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v3-hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v3-evidence-replay
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply hardening patch
        run: node scripts/harden-signal-lab-v3-evidence.mjs

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: npm test

      - name: Commit final hardening and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/signal-lab-v3-evidence-hardening.yml scripts/harden-signal-lab-v3-evidence.mjs
          git add signal-lab-v3-evidence.js owner-signal-lab-v3.js signal-lab-v3-store.js test/signal-lab-v3-evidence.test.js
          git commit -m "Harden Signal Lab V3 evidence storage and replay [signal-lab-v3-hardening-applied]"
          git push origin HEAD:agent/signal-lab-v3-evidence-replay
