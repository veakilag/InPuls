name: Apply water Tape renderer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: github.head_ref == 'agent/water-tape-renderer-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scope generated-tree guard to the Tape painter
        run: sed -i '/assert "layoutTapeSequence(items" not in orderbook/d' .github/scripts/apply-water-tape-renderer-v1.py
      - name: Apply water Tape renderer
        run: python .github/scripts/apply-water-tape-renderer-v1.py
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check chart.js
          node --check app.js
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-water-tape-renderer-v1.py
          rm -f .github/workflows/apply-water-tape-renderer-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebuild Tape as continuous water flow"
          git push origin HEAD:${{ github.head_ref }}
