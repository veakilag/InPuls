name: Apply Binance clock sync patch

on:
  push:
    branches:
      - fix/binance-clock-sync-v1
    paths:
      - scripts/apply-binance-clock-sync-v1.mjs

permissions:
  contents: write

concurrency:
  group: apply-binance-clock-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Apply exact runtime patch
        run: node scripts/apply-binance-clock-sync-v1.mjs

      - name: Validate JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: npm test

      - name: Validate diff
        run: git diff --check

      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js orderbook.js orderbook-worker.js index.html sw.js binance-clock.js test-*.mjs reset*.html refresh.html
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "fix: synchronize site and Tape with Binance time"
          git push origin HEAD:${GITHUB_REF_NAME}
