name: Apply Signal Lab V4 stage four

on:
  push:
    branches:
      - agent/signal-lab-v4-cascade-review-calibration

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v4-stage4-applied]') && !contains(github.event.head_commit.message, '[signal-lab-v4-stage4-log]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out calibration branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v4-cascade-review-calibration
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Stage 4 integration
        run: python scripts/patch-signal-lab-v4-stage4.py

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: |
          set +e
          npm test > /tmp/signal-lab-v4-stage4-tests.log 2>&1
          code=$?
          cat /tmp/signal-lab-v4-stage4-tests.log
          echo "TEST_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Publish regression failure
        if: env.TEST_EXIT != '0'
        run: |
          cp /tmp/signal-lab-v4-stage4-tests.log V4_STAGE4_TEST_FAILURE.txt
          grep -n -E '^(not ok|# fail|# pass|# tests)' /tmp/signal-lab-v4-stage4-tests.log > V4_STAGE4_FAILURE_SUMMARY.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add V4_STAGE4_TEST_FAILURE.txt V4_STAGE4_FAILURE_SUMMARY.txt
          git commit -m "Capture Signal Lab V4 Stage 4 failure [signal-lab-v4-stage4-log]"
          git push origin HEAD:agent/signal-lab-v4-cascade-review-calibration
          exit 1

      - name: Commit clean Stage 4 implementation
        if: env.TEST_EXIT == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-signal-lab-v4-stage4.yml scripts/patch-signal-lab-v4-stage4.py
          if [ -f V4_STAGE4_TEST_FAILURE.txt ]; then git rm -f V4_STAGE4_TEST_FAILURE.txt; fi
          if [ -f V4_STAGE4_FAILURE_SUMMARY.txt ]; then git rm -f V4_STAGE4_FAILURE_SUMMARY.txt; fi
          git add signal-lab-v4-calibration.js signal-lab-v3-store.js owner-signal-lab-v3.html owner-signal-lab-v3.js owner-signal-lab-v4-calibration.css test/signal-lab-v4-calibration.test.js test/signal-lab-v4-calibration-integration.test.js docs/signal-lab-v4-cascade-calibration-stage4.md
          git commit -m "Add Signal Lab V4 cascade review calibration [signal-lab-v4-stage4-applied]"
          git push origin HEAD:agent/signal-lab-v4-cascade-review-calibration
