name: Apply Signal Lab V4.15 confluence and reversal

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v4-15-confluence-reversal.py
      - .github/workflows/apply-signal-lab-v4-15-confluence-reversal.yml

permissions:
  contents: write

concurrency:
  group: signal-lab-v4-15-confluence-reversal
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply V4.15 calibration
        run: python3 scripts/apply-signal-lab-v4-15-confluence-reversal.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v4-15-confluence-reversal.py
          rm -f .github/workflows/apply-signal-lab-v4-15-confluence-reversal.yml
          rm -rf scripts/__pycache__

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-v7-multi-timeframe-levels.js
          git diff --check

      - name: Test V4.15 focused regressions
        run: |
          node --test \
            test/signal-lab-v7-high-working-pivot.test.js \
            test/signal-lab-v7-local-frontier.test.js \
            test/signal-lab-v7-no-resurrection.test.js

      - name: Fixed-window HFT 5m diagnostic
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { StructuralExtremeEngine } from './signal-lab-v7-structural-extremes.js';
          import {
            buildStructuralVolatilityContext,
            normalizeStructuralLevel,
            structuralLocalWorkingSetPivotDecision,
          } from './signal-lab-v7-multi-timeframe-levels.js';

          const symbol = 'HFTUSDT';
          const endAt = 1786100160000;
          const step = 300000;
          const startAt = endAt - 30 * 24 * 60 * 60 * 1000;
          const exchange = await fetch(`https://fapi.binance.com/fapi/v1/exchangeInfo?symbol=${symbol}`).then(r => {
            if (!r.ok) throw new Error(`exchangeInfo HTTP ${r.status}`);
            return r.json();
          });
          const symbolInfo = exchange.symbols?.find(row => row.symbol === symbol);
          const tickSize = Number(symbolInfo?.filters?.find(row => row.filterType === 'PRICE_FILTER')?.tickSize);
          if (!(tickSize > 0)) throw new Error('tick size unavailable');
          const candles = [];
          for (let cursor = Math.floor(startAt / step) * step; cursor <= endAt; cursor += step * 1500) {
            const url = new URL('https://fapi.binance.com/fapi/v1/klines');
            url.searchParams.set('symbol', symbol);
            url.searchParams.set('interval', '5m');
            url.searchParams.set('startTime', String(cursor));
            url.searchParams.set('endTime', String(Math.min(endAt, cursor + step * 1500 - 1)));
            url.searchParams.set('limit', '1500');
            const payload = await fetch(url).then(r => {
              if (!r.ok) throw new Error(`klines HTTP ${r.status}`);
              return r.json();
            });
            for (const row of payload) {
              if (Number(row[6]) > endAt) continue;
              candles.push({
                time: Number(row[0]), open: Number(row[1]), high: Number(row[2]), low: Number(row[3]),
                close: Number(row[4]), volume: Number(row[5]), closeTime: Number(row[6]), closed: true,
              });
            }
          }
          const byTime = new Map(candles.map(row => [row.time, row]));
          const rows = [...byTime.values()].filter(row => row.time >= startAt && row.time <= endAt).sort((a,b) => a.time-b.time);
          const engine = new StructuralExtremeEngine({
            symbol,
            timeframe: '5m',
            tickSize,
            config: { minimumSwingPercent: 0.10, minimumPercent: 0.08, atrMultiplier: 0, minimumBarsAfterCandidate: 1 },
          });
          engine.ingestCandles(rows);
          const snapshot = engine.snapshot();
          const volatility = buildStructuralVolatilityContext(rows);
          const all = [...(snapshot.active ?? []), ...(snapshot.history ?? [])];
          const candidates = all
            .filter(row => row.side === 'HIGH' && Math.abs(Number(row.price) - 0.024) <= Math.max(tickSize * 3, 0.00005))
            .sort((a,b) => Math.abs(Number(a.price)-0.024)-Math.abs(Number(b.price)-0.024));
          if (!candidates.length) {
            console.log('HFT_DIAG no native HIGH near 0.024 found');
          } else {
            const extreme = candidates[0];
            const level = normalizeStructuralLevel(extreme, '5m', endAt);
            const decision = structuralLocalWorkingSetPivotDecision(level, rows, volatility);
            console.log('HFT_DIAG', JSON.stringify({
              price: extreme.price,
              extremeAt: extreme.extremeAt,
              confirmingReversalPct: extreme.confirmingReversalPct,
              baseNatrPct: volatility.baseNatrPct,
              incomingBaseNatr: decision.incomingBaseNatr,
              confirmingReversalBaseNatr: decision.confirmingReversalBaseNatr,
              visible: decision.visible,
              reason: decision.reason,
            }));
          }
          NODE

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V4.15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Calibrate local confluence retention and 5m HIGH confirmation V4.15"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
