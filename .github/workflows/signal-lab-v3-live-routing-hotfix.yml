name: Apply Signal Lab V3 live routing hotfix

on:
  push:
    branches:
      - fix/signal-lab-v3-live-routing

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v3-hotfix-applied]') && !contains(github.event.head_commit.message, '[signal-lab-v3-test-log]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/signal-lab-v3-live-routing
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair patcher template escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-signal-lab-v3-live-routing.mjs')
          source = path.read_text()
          source = source.replace(r'\`${symbol.toLowerCase()}@aggTrade\`', r'\`\${symbol.toLowerCase()}@aggTrade\`')
          source = source.replace(r'\`Binance subscription: ${String(payload?.msg ?? payload.code).slice(0, 140)}\`', r'\`Binance subscription: \${String(payload?.msg ?? payload.code).slice(0, 140)}\`')
          source = source.replace(r'\`Binance book subscription: ${String(payload?.msg ?? payload.code).slice(0, 140)}\`', r'\`Binance book subscription: \${String(payload?.msg ?? payload.code).slice(0, 140)}\`')
          path.write_text(source)
          PY

      - name: Apply routing patch
        run: node scripts/patch-signal-lab-v3-live-routing.mjs

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run regression tests with captured output
        run: |
          set +e
          npm test > /tmp/signal-lab-v3-tests.log 2>&1
          code=$?
          cat /tmp/signal-lab-v3-tests.log
          echo "TEST_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Publish regression failure for diagnosis
        if: env.TEST_EXIT != '0'
        run: |
          cp /tmp/signal-lab-v3-tests.log HOTFIX_TEST_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HOTFIX_TEST_FAILURE.txt
          git commit -m "Capture Signal Lab V3 regression failure [signal-lab-v3-test-log]"
          git push origin HEAD:fix/signal-lab-v3-live-routing
          exit 1

      - name: Commit final hotfix and remove temporary patcher
        if: env.TEST_EXIT == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/signal-lab-v3-live-routing-hotfix.yml scripts/patch-signal-lab-v3-live-routing.mjs
          git add signal-lab-v3-collector.js owner-signal-lab-v3.js owner-signal-lab-v3.html test/signal-lab-v3-collector.test.js
          git commit -m "Fix Signal Lab V3 live market routing [signal-lab-v3-hotfix-applied]"
          git push origin HEAD:fix/signal-lab-v3-live-routing
