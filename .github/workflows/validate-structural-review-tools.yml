name: Validate structural review annotation tools

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - .github/workflows/validate-structural-review-tools.yml
      - scripts/apply-structural-review-timeframe-eraser.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply requested chart and review fixes
        run: python3 scripts/apply-structural-review-timeframe-eraser.py

      - name: Remove temporary patch workflows
        run: |
          rm -f scripts/apply-structural-review-timeframe-eraser.py
          rm -f .github/workflows/apply-structural-review-timeframe-eraser.yml

      - name: Validate review runtime syntax
        run: |
          node --check chart.js
          node --check owner-signal-lab-structural-extremes-review.js
          node --check signal-lab-v7-structural-extremes.js
          python3 -m py_compile scripts/build-structural-extremes-review-bundle.py
          git diff --check

      - name: Run focused chart, review and detector tests
        run: node --test test/chart.test.js test/signal-lab-v7-structural-extremes-isolation.test.js test/signal-lab-v7-structural-extremes.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Build standalone review page
        run: |
          python3 scripts/build-structural-extremes-review-bundle.py
          test -s structural-extremes-review-standalone.html
          grep -q "Разметка для обучения" structural-extremes-review-standalone.html
          grep -q "data-review-tool=\"erase\"" structural-extremes-review-standalone.html
          grep -q "mapWithConcurrency" structural-extremes-review-standalone.html
          grep -q "timeAtCandleSlot" structural-extremes-review-standalone.html

      - name: Commit verified fixes and standalone page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix candle timeframe slots, 1m loading and review eraser"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
