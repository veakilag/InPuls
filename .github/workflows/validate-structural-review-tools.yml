name: Validate structural review annotation tools

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - .github/workflows/validate-structural-review-tools.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate review runtime syntax
        run: |
          node --check owner-signal-lab-structural-extremes-review.js
          node --check signal-lab-v7-structural-extremes.js
          python3 -m py_compile scripts/build-structural-extremes-review-bundle.py
          git diff --check origin/main...HEAD

      - name: Run focused review and detector tests
        run: node --test test/signal-lab-v7-structural-extremes-isolation.test.js test/signal-lab-v7-structural-extremes.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Build standalone review page
        run: |
          python3 scripts/build-structural-extremes-review-bundle.py
          test -s structural-extremes-review-standalone.html
          grep -q "Разметка для обучения" structural-extremes-review-standalone.html
          grep -q "InPulsStructuralExtremesTraderReview" structural-extremes-review-standalone.html

      - name: Upload standalone review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structural-extremes-review-standalone
          path: structural-extremes-review-standalone.html
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated standalone page
        run: |
          if git diff --quiet -- structural-extremes-review-standalone.html; then
            echo "Standalone page is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add structural-extremes-review-standalone.html
          git commit -m "Build standalone structural extrema review page"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
