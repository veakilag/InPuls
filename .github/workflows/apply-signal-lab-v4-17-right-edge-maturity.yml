name: Apply Signal Lab V4.17 right-edge maturity

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v4-17-right-edge-maturity.py
      - .github/workflows/apply-signal-lab-v4-17-right-edge-maturity.yml

permissions:
  contents: write

concurrency:
  group: signal-lab-v4-17-right-edge-maturity
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply V4.17 right-edge maturity
        run: python3 scripts/apply-signal-lab-v4-17-right-edge-maturity.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v4-17-right-edge-maturity.py
          rm -f .github/workflows/apply-signal-lab-v4-17-right-edge-maturity.yml
          rm -rf scripts/__pycache__

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-v7-multi-timeframe-levels.js
          git diff --check

      - name: Test V4.17 focused regressions
        run: |
          node --test \
            test/signal-lab-v7-local-frontier.test.js \
            test/signal-lab-v7-high-working-pivot.test.js \
            test/signal-lab-v7-no-resurrection.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V4.17
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Filter unresolved 1m right-edge pivots V4.17"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
