name: Apply Signal Lab V4.19 debug bootstrap

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1
    paths:
      - scripts/apply-signal-lab-v4-19-debug-bootstrap.py
      - .github/workflows/apply-signal-lab-v4-19-debug-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: signal-lab-v4-19-debug-bootstrap
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Apply V4.19 debug bootstrap
        run: python3 scripts/apply-signal-lab-v4-19-debug-bootstrap.py

      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v4-19-debug-bootstrap.py
          rm -f .github/workflows/apply-signal-lab-v4-19-debug-bootstrap.yml
          rm -rf scripts/__pycache__

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          git diff --check

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V4.19
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make Signal Lab debug bootstrap observable V4.19"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
