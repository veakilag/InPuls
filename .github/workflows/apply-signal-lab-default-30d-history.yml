name: Apply Signal Lab default 30d history

on:
  push:
    branches:
      - agent/signal-lab-default-30d-history
    paths:
      - .github/workflows/apply-signal-lab-default-30d-history.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-default-30d-history
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply 30-day history defaults
        run: python scripts/apply-signal-lab-default-30d-history.py

      - name: Remove temporary patch runner
        run: |
          rm scripts/apply-signal-lab-default-30d-history.py
          rm .github/workflows/apply-signal-lab-default-30d-history.yml

      - name: Validate syntax and diff
        run: |
          node --check signal-lab-chart-modal.js
          node --check owner-signal-lab-v3.js
          node --check scripts/signal-lab-runtime-smoke.mjs
          git diff --check

      - name: Run modal regression test
        run: node --test test/signal-lab-modal-chart.test.js

      - name: Run full test suite
        run: npm test

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Open Signal Lab episodes with 30 days of candle history"
          git push origin HEAD:agent/signal-lab-default-30d-history
