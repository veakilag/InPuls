name: Apply Signal Lab setup visibility fix

on:
  push:
    branches:
      - agent/signal-lab-live-setup-contract
    paths:
      - .github/workflows/apply-signal-lab-setup-visibility.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/signal-lab-live-setup-contract
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Patch setup publication and counters
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "signal-lab-v3-candidates.js",
              '''  if (
              !symbol
              || price === null
              || price <= 0
              || warmupSeconds < settings.minimumWarmupSeconds
            ) return [];

            const result = detectCascadeV4Candidates(metrics, now, settings);
            if (!isEligibleForSignalLabV3(metrics, settings)) {''',
              '''  if (!symbol || price === null || price <= 0) return [];

            // V4 uses already-loaded historical extrema and level maps. It must be
            // published as soon as that deterministic structure exists; the live
            // 35-second warmup remains only for legacy tape-dependent candidates.
            const result = detectCascadeV4Candidates(metrics, now, settings);
            if (warmupSeconds < settings.minimumWarmupSeconds) {
              return result.sort((left, right) => right.evidenceScore - left.evidenceScore);
            }
            if (!isEligibleForSignalLabV3(metrics, settings)) {''',
          )

          replace_once(
              "signal-lab-v3-collector.js",
              '''      expiredEpisodes: 0,
              symbols: 0,''',
              '''      expiredEpisodes: 0,
              activeEpisodes: 0,
              symbols: 0,''',
          )
          replace_once(
              "signal-lab-v3-collector.js",
              '''      expiredEpisodes: this.statusState.expiredEpisodes + result.expired.length,
              symbols: metrics.length,''',
              '''      expiredEpisodes: this.statusState.expiredEpisodes + result.expired.length,
              activeEpisodes: this.episodes.status().activeEpisodes,
              symbols: metrics.length,''',
          )

          replace_once(
              "owner-signal-lab-v3.html",
              '''        <article class="stat-card">
                  <span>Активных сейчас</span>
                  <strong id="active-count">0</strong>
                </article>''',
              '''        <article class="stat-card">
                  <span>Активных сетапов</span>
                  <strong id="active-count">0</strong>
                </article>
                <article class="stat-card">
                  <span>Активных экстремумов</span>
                  <strong id="extremes-count">0</strong>
                </article>
                <article class="stat-card">
                  <span>Монет с экстремумами</span>
                  <strong id="extreme-maps-count">0</strong>
                </article>
                <article class="stat-card">
                  <span>Каскадов SETUP</span>
                  <strong id="cascade-setup-count">0</strong>
                </article>''',
          )
          replace_once(
              "owner-signal-lab-v3.html",
              '''    <script type="module" src="./owner-signal-lab-v3.js?v=signal-lab-v6-extreme-history-fallback"></script>''',
              '''    <script type="module" src="./owner-signal-lab-v3.js?v=signal-lab-v7-setup-visibility"></script>''',
          )

          replace_once(
              "owner-signal-lab-v3.js",
              '''} from "./signal-lab-v3-candidates.js?v=signal-lab-v5-patterns-1";
            import { SignalLabV3Collector } from "./signal-lab-v3-collector.js?v=signal-lab-v6-extreme-history-fallback";''',
              '''} from "./signal-lab-v3-candidates.js?v=signal-lab-v7-setup-visibility";
            import { SignalLabV3Collector } from "./signal-lab-v3-collector.js?v=signal-lab-v7-setup-visibility";''',
          )
          replace_once(
              "owner-signal-lab-v3.js",
              '''  activeCount: document.querySelector("#active-count"),
              reviewedCount: document.querySelector("#reviewed-count"),''',
              '''  activeCount: document.querySelector("#active-count"),
              extremesCount: document.querySelector("#extremes-count"),
              extremeMapsCount: document.querySelector("#extreme-maps-count"),
              cascadeSetupCount: document.querySelector("#cascade-setup-count"),
              reviewedCount: document.querySelector("#reviewed-count"),''',
          )
          replace_once(
              "owner-signal-lab-v3.js",
              '''  return `${connection} · проверки ${status.checks} · эпизоды ${status.createdEpisodes} · экстремумы ${status.activeExtremes ?? 0} активных / ${status.extremeMaps ?? 0} монет''',
              '''  return `${connection} · проверки ${status.checks} · эпизоды ${status.createdEpisodes} · активные сетапы ${status.activeEpisodes ?? 0} · экстремумы ${status.activeExtremes ?? 0} активных / ${status.extremeMaps ?? 0} монет''',
          )
          replace_once(
              "owner-signal-lab-v3.js",
              '''  elements.checksCount.textContent = String(status?.checks ?? 0);
              elements.warmupCount.textContent = String(status?.warmupLoaded ?? 0);''',
              '''  elements.checksCount.textContent = String(status?.checks ?? 0);
              elements.activeCount.textContent = String(status?.activeEpisodes ?? 0);
              elements.extremesCount.textContent = String(status?.activeExtremes ?? 0);
              elements.extremeMapsCount.textContent = String(status?.extremeMaps ?? 0);
              elements.cascadeSetupCount.textContent = String(status?.cascadeSetups ?? 0);
              elements.warmupCount.textContent = String(status?.warmupLoaded ?? 0);''',
          )

          replace_once(
              "scripts/signal-lab-runtime-smoke.mjs",
              '''    && Number(state?.warmupLoaded || 0) > 0
                && Number(state?.activeExtremes || 0) > 0''',
              '''    && Number(state?.warmupLoaded || 0) > 0
                && Number(state?.activeEpisodes || 0) > 0
                && Number(state?.activeExtremes || 0) > 0''',
          )

          Path("test/signal-lab-v7-setup-visibility.test.js").write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import {
            CANDIDATE_TYPES,
            detectExpertCandidates,
          } from "../signal-lab-v3-candidates.js";

          function cascadeMetrics(overrides = {}) {
            return {
              symbol: "BTCUSDT",
              price: 99,
              updatedAt: 1_000,
              warmupSeconds: 3,
              quoteVolume24h: 50_000_000,
              cascadeMap: {
                active: [{
                  id: "BTCUSDT:UP:h1:test",
                  state: "SETUP",
                  geometricState: "SETUP",
                  direction: "UP",
                  levelIds: ["h1", "h2"],
                  levelPrices: [100, 102],
                  adjacentGapPct: [2],
                  totalSpanPct: 2,
                  levelsBroken: 0,
                  touchCounts: [1, 2],
                  variants: ["MULTI_TOUCH_LEVEL"],
                  compressionType: "NO_COMPRESSION",
                  setupDetectedAt: 900,
                  setupFeatures: { primaryDistancePct: 1 },
                  dataQuality: "LIVE",
                  formulaVersion: "test-cascade",
                }],
              },
              ...overrides,
            };
          }

          test("V4 cascade SETUP is published before the legacy 35-second warmup", () => {
            const candidates = detectExpertCandidates(cascadeMetrics(), 1_000);
            assert.equal(candidates.length, 1);
            assert.equal(candidates[0].candidateType, CANDIDATE_TYPES.CASCADE_V4_UP);
            assert.equal(candidates[0].stage, "forming");
          });

          test("legacy candidates remain blocked before warmup when no V4 setup exists", () => {
            const candidates = detectExpertCandidates(cascadeMetrics({ cascadeMap: { active: [] } }), 1_000);
            assert.deepEqual(candidates, []);
          });
          ''', encoding="utf-8")
          PY

      - name: Run complete test suite
        run: npm test

      - name: Prove visible setup in a real browser
        env:
          CHROME_BIN: google-chrome
        run: |
          python3 -m http.server 4173 > /tmp/inpuls-http.log 2>&1 &
          server_pid=$!
          trap 'kill ${server_pid} 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          node scripts/signal-lab-runtime-smoke.mjs "http://127.0.0.1:4173/owner-signal-lab-v3.html?setup-visibility=${GITHUB_SHA}"

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-signal-lab-setup-visibility.yml
          git add signal-lab-v3-candidates.js signal-lab-v3-collector.js owner-signal-lab-v3.html owner-signal-lab-v3.js scripts/signal-lab-runtime-smoke.mjs test/signal-lab-v7-setup-visibility.test.js
          git commit -m "Show live Signal Lab setups without false warmup zero"
          git push origin HEAD:agent/signal-lab-live-setup-contract
