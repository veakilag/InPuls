name: Live production extrema diagnostic

on:
  push:
    branches:
      - diagnostic/live-extrema-after-pr159

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: diagnostic/live-extrema-after-pr159

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Wait for deployed Signal Lab extrema
        run: node scripts/live-extrema-production-check.mjs "https://veakilag.github.io/InPuls/owner-signal-lab-v3.html?extremes=6ec8cd5a"
