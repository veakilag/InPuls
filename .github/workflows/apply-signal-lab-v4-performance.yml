name: Apply Signal Lab V4 performance hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-v4-performance-applied]') && !contains(github.event.head_commit.message, '[signal-lab-v4-performance-log]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply performance hotfix
        run: |
          python scripts/patch-signal-lab-v4-performance.py
          python - <<'PY'
          from pathlib import Path
          path = Path('test/signal-lab-v3-evidence.test.js')
          text = path.read_text(encoding='utf-8')
          old = r'assert.match(source, /merged\.slice\(0, 60\)/);'
          new = r'assert.match(source, /merged\.slice\(0, 12\)/);'
          if old not in text:
              raise SystemExit('legacy 60-card performance contract not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: |
          set +e
          npm test > /tmp/signal-lab-v4-performance-tests.log 2>&1
          code=$?
          cat /tmp/signal-lab-v4-performance-tests.log
          echo "TEST_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Publish regression failure
        if: env.TEST_EXIT != '0'
        run: |
          cp /tmp/signal-lab-v4-performance-tests.log SIGNAL_LAB_V4_PERFORMANCE_FAILURE.txt
          grep -n -E '^(not ok|# fail|# pass|# tests)' /tmp/signal-lab-v4-performance-tests.log > SIGNAL_LAB_V4_PERFORMANCE_SUMMARY.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SIGNAL_LAB_V4_PERFORMANCE_FAILURE.txt SIGNAL_LAB_V4_PERFORMANCE_SUMMARY.txt
          git commit -m "Capture Signal Lab V4 performance failure [signal-lab-v4-performance-log]"
          git push origin HEAD:main
          exit 1

      - name: Commit clean performance hotfix
        if: env.TEST_EXIT == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-signal-lab-v4-performance.yml scripts/patch-signal-lab-v4-performance.py SIGNAL_LAB_V4_PERFORMANCE_FAILURE.txt SIGNAL_LAB_V4_PERFORMANCE_SUMMARY.txt
          git add signal-lab-v4-extremes.js signal-lab-v3-collector.js owner-signal-lab-v3.js test/signal-lab-v3-evidence.test.js test/signal-lab-v4-performance-hotfix.test.js
          git commit -m "Fix Signal Lab V4 main-thread stalls [signal-lab-v4-performance-applied]"
          git push origin HEAD:main
