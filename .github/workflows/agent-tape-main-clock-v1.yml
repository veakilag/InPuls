name: Apply Tape main clock

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/agent-tape-main-clock-v1.yml
      - tools/apply-tape-main-clock-v1.py

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/tape-main-clock-alignment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tape-main-clock-alignment
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply focused patch
        run: python tools/apply-tape-main-clock-v1.py

      - name: Check runtime syntax
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js

      - name: Run full tests
        run: npm test

      - name: Commit verified runtime
        run: |
          rm -f tools/apply-tape-main-clock-v1.py .github/workflows/agent-tape-main-clock-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Tape main clock alignment" -m "Use the main Binance clock to align packet receipt time for both Tape and footprint while preserving execution time."
          git push origin HEAD:agent/tape-main-clock-alignment
