name: Apply Signal Lab V6.6 compact research snapshot

on:
  push:
    branches:
      - agent/signal-lab-structural-extremes-stage1

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v6
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply V6.6 compact research snapshot
        run: python3 scripts/apply-signal-lab-v6-6-compact-research-snapshot.py

      - name: Remove temporary apply machinery
        run: |
          rm -f scripts/apply-signal-lab-v6-6-compact-research-snapshot.py
          rm -f .github/workflows/apply-signal-lab-v6-6-compact-research-snapshot.yml

      - name: Validate syntax and focused V6.6 tests
        run: |
          node --check signal-lab-v7-multi-timeframe-review-runtime.js
          node --test test/signal-lab-v7-compact-research-snapshot.test.js
          python3 - <<'PY'
          from pathlib import Path
          runtime = Path('signal-lab-v7-multi-timeframe-review-runtime.js').read_text()
          assert 'copy-structural-research' in runtime
          assert 'RESEARCH SNAPSHOT v6.6-compact-cross-asset-2026-08' in runtime
          assert '__INPULS_RESEARCH_SNAPSHOT_TEXT__' in runtime
          assert 'LOCAL LEVELS 0-5%' in runtime
          assert not Path('scripts/apply-signal-lab-v6-6-compact-research-snapshot.py').exists()
          assert not Path('.github/workflows/apply-signal-lab-v6-6-compact-research-snapshot.yml').exists()
          PY
          git diff --check

      - name: Run structural regression set
        run: |
          node --test \
            test/signal-lab-v7-multi-timeframe-levels.test.js \
            test/signal-lab-v7-attack-count-runtime.test.js \
            test/signal-lab-v7-pierce-lifecycle.test.js \
            test/signal-lab-v7-tradable-structure-v5.test.js \
            test/signal-lab-v7-vshape-shadow-metrics.test.js \
            test/signal-lab-v7-review-generation.test.js \
            test/signal-lab-v7-no-resurrection.test.js \
            test/signal-lab-v8-level-context.test.js \
            test/signal-lab-v7-compact-research-snapshot.test.js

      - name: Run complete regression suite
        run: npm test

      - name: Commit verified V6.6 compact research snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git ls-files --error-unmatch scripts/apply-signal-lab-v6-6-compact-research-snapshot.py >/dev/null 2>&1; then
            echo "temporary patch script is still tracked after staging deletions" >&2
            exit 1
          fi
          if git ls-files --error-unmatch .github/workflows/apply-signal-lab-v6-6-compact-research-snapshot.yml >/dev/null 2>&1; then
            echo "temporary workflow is still tracked after staging deletions" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 1
          fi
          git commit -m "Add V6.6 compact research snapshot"
          git push origin agent/signal-lab-structural-extremes-stage1
