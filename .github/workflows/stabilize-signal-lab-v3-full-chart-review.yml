name: Stabilize Signal Lab V3.3 full chart review

on:
  push:
    branches:
      - agent/signal-lab-v3-full-chart-review

permissions:
  contents: write

jobs:
  stabilize:
    if: ${{ !contains(github.event.head_commit.message, '[signal-lab-review-lock-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-v3-full-chart-review
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply review lock
        run: python scripts/stabilize-signal-lab-v3-full-chart-review.py

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run full regression suite
        run: npm test

      - name: Commit stabilization and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/stabilize-signal-lab-v3-full-chart-review.yml scripts/stabilize-signal-lab-v3-full-chart-review.py
          rm -f .github/trigger-signal-lab-review-lock.txt
          git add signal-lab-v3-full-chart.js owner-signal-lab-v3.js test/signal-lab-v3-full-chart.test.js
          git commit -m "Stabilize Signal Lab full chart review [signal-lab-review-lock-applied]"
          git push origin HEAD:agent/signal-lab-v3-full-chart-review
