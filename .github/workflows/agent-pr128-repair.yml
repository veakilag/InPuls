name: Apply PR128 repair

on:
  push:
    branches:
      - agent/fix-tape-clock-frozen-clusters
    paths:
      - .github/workflows/agent-pr128-repair.yml
      - tools/apply-pr128-fix.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-tape-clock-frozen-clusters
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply focused runtime fix
        run: python tools/apply-pr128-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run full tests
        run: npm test

      - name: Commit verified changes
        run: |
          rm -f tools/apply-pr128-fix.py .github/workflows/agent-pr128-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Tape sync and frozen clusters" -m "Keep exact Tape timing, freeze closed footprint projections, preserve POC and full theme preview, and add draggable site time."
          git push origin HEAD:agent/fix-tape-clock-frozen-clusters

# Trigger after workflow registration.
