name: Build PR128 repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'agent/fix-tape-clock-frozen-clusters'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply focused runtime fix
        run: python tools/apply-pr128-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run full tests
        run: npm test

      - name: Prepare verified files
        shell: bash
        run: |
          mkdir -p pr128-artifact/files
          git diff --name-only -z | while IFS= read -r -d '' file; do
            mkdir -p "pr128-artifact/files/$(dirname "$file")"
            cp "$file" "pr128-artifact/files/$file"
          done
          git diff --binary > pr128-artifact/pr128.patch
          git diff --name-only > pr128-artifact/files.txt

      - name: Upload verified files
        uses: actions/upload-artifact@v4
        with:
          name: pr128-verified-files
          path: pr128-artifact
          if-no-files-found: error
