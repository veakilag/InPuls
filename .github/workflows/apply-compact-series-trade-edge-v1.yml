name: Apply compact Series and trade-edge fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/compact-series-trade-edge-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align Compact Series patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/apply_compact_series_trade_edge_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '''motion_count = text.count(old_motion_call)
          if motion_count != 2:
              raise RuntimeError(f"aggregate motion calls: expected 2 matches, got {motion_count}")
          text = text.replace(old_motion_call, new_motion_call)'''
          new = '''motion_count = text.count(old_motion_call)
          if motion_count != 1:
              raise RuntimeError(f"unlabelled aggregate motion call: expected 1 match, got {motion_count}")
          text = text.replace(old_motion_call, new_motion_call, 1)'''
          if old not in text:
              raise SystemExit("motion anchor block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply compact Series implementation
        run: |
          python tools/apply_compact_series_trade_edge_v1.py
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("orderbook.js")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?m)^(\s{4})drawAggregatePriceRange\(\n'
              r'(\s{6})context,\n'
              r'\2state\.priceViewport,\n'
              r'\2item,\n'
              r'\2x,\n'
              r'\2buy,\n'
              r'\2stroke,\n'
              r'\2strength,\n'
              r'\2openAggregate,\n'
              r'\1\);'
          )

          def replacement(match):
              outer = match.group(1)
              inner = match.group(2)
              return (
                  f"{outer}drawAggregateMotion(\n"
                  f"{inner}context,\n"
                  f"{inner}state.priceViewport,\n"
                  f"{inner}item,\n"
                  f"{inner}x,\n"
                  f"{inner}buy,\n"
                  f"{inner}stroke,\n"
                  f"{inner}strength,\n"
                  f"{inner}sweepMode,\n"
                  f"{inner}openAggregate,\n"
                  f"{outer});"
              )

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"labelled aggregate motion call: expected 1 match, got {count}")
          path.write_text(text, encoding="utf-8")
          PY
          python tools/apply_series_label_declutter_v1.py

      - name: Align Compact Series regression contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          range_test = Path("test-agg-range-rx-fix-v1.mjs")
          replace_once(
              range_test,
              '  assert.ok((runtime.match(/drawAggregatePriceRange\\(/g) ?? []).length >= 3);',
              '''  assert.match(runtime, /function drawAggregateMotion\\(/);
          assert.match(runtime, /\\? drawSweepDirection\\(/);
          assert.match(runtime, /: drawAggregatePriceRange\\(/);''',
              "AGG motion routing contract",
          )

          threshold_test = Path("test-tape-threshold-agg-visual-v1.mjs")
          replace_once(
              threshold_test,
              '  assert.match(painter, /const showLabel = minQuote > 0 \\|\\| Boolean\\(item\\.showLabel\\)/);',
              '''  assert.match(painter, /const showLabel = sweepMode[\\s\\S]*\\? Boolean\\(sweepLabelKeys\\?\\.has\\(item\\.key\\)\\)[\\s\\S]*: minQuote > 0 \\|\\| Boolean\\(item\\.showLabel\\)/);''',
              "threshold and Series label contract",
          )
          PY

      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-flow-workspace.js
          node --check app.js
          node --check orderbook-worker.js

      - name: Full test suite
        run: npm test

      - name: Remove patch scaffolding
        run: |
          rm -f tools/apply_compact_series_trade_edge_v1.py
          rm -f tools/apply_series_label_declutter_v1.py
          rm -f .github/workflows/apply-compact-series-trade-edge-v1.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Compact Series tape and anchor it to live trades"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
