name: Apply live footprint source hotfix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.ref == 'fix/live-footprint-source-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply hotfix
        run: python tools/apply_live_footprint_source_v1.py

      - name: Syntax checks
        run: |
          node --check orderbook-flow-workspace.js
          node --check orderbook.js
          node --check test-footprint-live-source-v1.mjs

      - name: Focused footprint regressions
        run: |
          node --test \
            test-footprint-live-source-v1.mjs \
            test-orderbook-density-tape-footprint-v1.mjs \
            test-sweep-tape-clock-v1.mjs \
            test-arrival-clock-render-decouple-v1.mjs

      - name: Full test suite
        run: npm test

      - name: Remove patch scaffolding
        run: |
          rm -f tools/apply_live_footprint_source_v1.py
          rm -f .github/workflows/apply-live-footprint-source-v1.yml

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore live footprint accumulation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
