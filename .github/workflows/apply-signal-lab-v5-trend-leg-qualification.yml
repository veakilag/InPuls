name: Apply Signal Lab V5 trend-leg qualification

on:
  push:
    paths:
      - 'scripts/apply-signal-lab-v5-trend-leg-qualification.py'
      - '.github/workflows/apply-signal-lab-v5-trend-leg-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          ref: agent/signal-lab-structural-extremes-stage1
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V5.0 trend-leg qualification
        run: python3 scripts/apply-signal-lab-v5-trend-leg-qualification.py
      - name: Rebuild standalone calibration page
        run: python3 scripts/build-structural-extremes-review-bundle.py
      - name: Remove temporary apply machinery
        run: rm -f scripts/apply-signal-lab-v5-trend-leg-qualification.py .github/workflows/apply-signal-lab-v5-trend-leg-qualification.yml
      - name: Validate syntax and focused V5 regression
        run: |
          node --check signal-lab-v7-multi-timeframe-levels.js
          node --test test/signal-lab-v7-tradable-structure-v5.test.js
          git diff --check
      - name: Run structural regression set
        run: |
          node --test test/signal-lab-v7-multi-timeframe-levels.test.js test/signal-lab-v7-local-same-side-shadow.test.js test/signal-lab-v7-structural-extremes-v3.test.js
      - name: Run complete regression suite
        run: npm test
      - name: Commit verified V5.0
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add tradable trend-leg qualification V5.0"
          git push origin HEAD:agent/signal-lab-structural-extremes-stage1
