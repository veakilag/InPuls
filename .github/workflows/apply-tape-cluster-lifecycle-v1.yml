name: Apply Tape cluster lifecycle v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: github.head_ref == 'agent/tape-cluster-lifecycle-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair patch and compatibility assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-tape-cluster-lifecycle-v1.py')
          text = path.read_text(encoding='utf-8')

          old_boundary = r"r'  const syncTimeframes = \(\) => \{[\s\S]*?  syncTimeframes\(\);'"
          new_boundary = r'''r'  const syncTimeframes = \(\) => \{[\s\S]*?  syncTimeframes\(\);\n\n(?=  pane\.addEventListener\("wheel")' '''.rstrip()
          if old_boundary not in text:
              raise SystemExit('timeframe patch boundary anchor not found')
          text = text.replace(old_boundary, new_boundary, 1)

          old_layout = '''      ...item,
      x: clamp(baseX, leftEdge, rightEdge),
      density: densityByBand.get(band) || 1,
      yOffset: 0,'''
          new_layout = '''      ...item,
      baseX,
      x: clamp(baseX, leftEdge, rightEdge),
      density: Math.min(
        TAPE_READABLE_LAYOUT.maxClusterItems,
        densityByBand.get(band) || 1,
      ),
      yOffset: 0,'''
          if old_layout not in text:
              raise SystemExit('static Tape layout return anchor not found')
          text = text.replace(old_layout, new_layout, 1)

          marker = '# Runtime/cache version is atomic across app shell and tests.'
          compatibility = r'''
# Refresh assertions whose old contract intentionally allowed only 1m/5m.
path = "test-orderbook-flow-workspace.mjs"
text = read(path)
text = text.replace(
    'assert.deepEqual([...FOOTPRINT_TIMEFRAMES], [60_000, 300_000]);',
    'assert.deepEqual([...FOOTPRINT_TIMEFRAMES], ["1s", "5s", "15s", "1m", "3m", "5m", "15m", "30m", "1h", "2h", "4h", "12h", "1d", "3d", "1w", "1M"]);',
)
text = text.replace('assert.match(source, /data-footprint-timeframe="60000"/);', 'assert.match(source, /data-footprint-select/);')
text = text.replace('assert.match(source, /data-footprint-timeframe="300000"/);', 'assert.match(source, /data-footprint-favorite/);')
text = text.replace('assert.doesNotMatch(source, /PARTIAL ·/);', 'assert.match(source, /sessionPartial/);')
write(path, text)

path = "test-orderbook-runtime-stability.mjs"
text = read(path)
text = text.replace('assert.match(flow, /data-footprint-timeframe="60000"/);', 'assert.match(flow, /data-footprint-select/);')
text = text.replace('assert.match(flow, /data-footprint-timeframe="300000"/);', 'assert.match(flow, /data-footprint-favorite/);')
write(path, text)

path = "test-orderbook-tape-v2-core.mjs"
text = read(path)
text = text.replace(
    'assert.match(orderbook, /button\\.textContent = aggregated \\? "AGG" : "RAW"/);',
    'assert.match(orderbook, /button\\.textContent = aggregated/);\n  assert.match(orderbook, /TAPE_AGGREGATION_LEVELS/);',
)
write(path, text)

'''
          if marker not in text:
              raise SystemExit('compatibility insertion marker not found')
          text = text.replace(marker, compatibility + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply focused runtime changes
        run: python .github/scripts/apply-tape-cluster-lifecycle-v1.py
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-tape-layout.js
          node --check orderbook-flow-workspace.js
          node --check app.js
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-tape-cluster-lifecycle-v1.py
          rm -f .github/workflows/apply-tape-cluster-lifecycle-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: stabilize Tape and align footprint intervals"
          git push origin HEAD:${{ github.head_ref }}
