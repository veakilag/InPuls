name: Apply Tape cluster lifecycle v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: github.head_ref == 'agent/tape-cluster-lifecycle-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair patch boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-tape-cluster-lifecycle-v1.py')
          text = path.read_text(encoding='utf-8')
          old = r"r'  const syncTimeframes = \(\) => \{[\s\S]*?  syncTimeframes\(\);'"
          new = r'''r'  const syncTimeframes = \(\) => \{[\s\S]*?  syncTimeframes\(\);\n\n(?=  pane\.addEventListener\("wheel")' '''.rstrip()
          if old not in text:
              raise SystemExit('timeframe patch boundary anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply focused runtime changes
        run: python .github/scripts/apply-tape-cluster-lifecycle-v1.py
      - name: Syntax checks
        run: |
          node --check orderbook.js
          node --check orderbook-tape-layout.js
          node --check orderbook-flow-workspace.js
          node --check app.js
      - name: Full test suite
        run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/scripts/apply-tape-cluster-lifecycle-v1.py
          rm -f .github/workflows/apply-tape-cluster-lifecycle-v1.yml
          git config user.name "InPuls automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: stabilize Tape and align footprint intervals"
          git push origin HEAD:${{ github.head_ref }}
