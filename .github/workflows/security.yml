name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/market-feed-footprint-series-v1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply market feed, footprint and Series update
        run: |
          python .github/scripts/apply-market-feed-footprint-series-v1.py
          python .github/scripts/update-footprint-tests-v1.py
          python .github/scripts/update-global-connection-test-v1.py

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Combined market feed contract
        run: node --test --test-name-pattern="global market feed" test-market-feed-footprint-series-v1.mjs

      - name: Footprint source promotion contract
        run: node --test --test-name-pattern="footprint bootstraps" test-market-feed-footprint-series-v1.mjs

      - name: Series opposite-side contract
        run: node --test --test-name-pattern="Series groups raw" test-market-feed-footprint-series-v1.mjs

      - name: Series 100ms window contract
        run: node --test --test-name-pattern="same-side trades outside" test-market-feed-footprint-series-v1.mjs

      - name: Footprint label and maximum contract
        run: node --test --test-name-pattern="footprint uses order-book" test-market-feed-footprint-series-v1.mjs

      - name: Sweep Tape contract
        run: node --test test-sweep-tape-clock-v1.mjs

      - name: Footprint live source contract
        run: node --test test-footprint-live-source-v1.mjs

      - name: Global connection cleanup contract
        run: node --test test-global-connection-radar-cleanup-v1.mjs

      - name: Run regression and security tests
        shell: bash
        run: |
          npm test > /tmp/npm-test.log 2>&1 || {
            echo "===== failing assertions ====="
            grep -nE "not ok|AssertionError|ERR_ASSERTION|failureType|expected:|actual:" /tmp/npm-test.log | tail -n 240 || true
            echo "===== log tail ====="
            tail -n 320 /tmp/npm-test.log
            exit 1
          }
          tail -n 30 /tmp/npm-test.log

      - name: Commit verified runtime and restore standard workflow
        run: |
          git rm .github/scripts/apply-market-feed-footprint-series-v1.py
          git rm .github/scripts/update-footprint-tests-v1.py
          git rm .github/scripts/update-global-connection-test-v1.py
          git rm .github/workflows/apply-market-feed-footprint-series-v1.yml
          git checkout origin/main -- .github/workflows/security.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore market feed and rebuild Footprint Series"
          git push origin HEAD:fix/market-feed-footprint-series-v1
