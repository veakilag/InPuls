name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply exact Binance clock patch
        if: github.actor != 'github-actions[bot]'
        run: |
          node scripts/prepare-binance-clock-patch-v1.mjs
          node scripts/apply-binance-clock-sync-v1.mjs

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run regression and security tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log

      - name: Commit patched runtime
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js orderbook.js orderbook-worker.js index.html sw.js binance-clock.js test-*.mjs reset*.html refresh.html
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "fix: synchronize site and Tape with Binance time"
          git push origin HEAD:${{ github.head_ref }}

      - name: Preserve regression output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-test-log-${{ github.run_id }}
          path: npm-test.log
          if-no-files-found: warn
          retention-days: 1
