name: Security checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Locate obsolete assertion
        shell: bash
        run: grep -R -n --exclude-dir=.git "Service worker cache name must be versioned" . > obsolete-sw-assertion.txt

      - name: Upload assertion location
        uses: actions/upload-artifact@v4
        with:
          name: obsolete-sw-assertion
          path: obsolete-sw-assertion.txt
          if-no-files-found: error
