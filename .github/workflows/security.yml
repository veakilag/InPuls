name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/market-feed-footprint-series-v1
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply runtime and show final red test
        run: |
          python .github/scripts/apply-market-feed-footprint-series-v1.py
          python .github/scripts/update-footprint-tests-v1.py
          python .github/scripts/update-global-connection-test-v1.py
          python .github/scripts/fix-flow-helper-tests-v1.py
          python .github/scripts/show-redraw-test-v1.py
