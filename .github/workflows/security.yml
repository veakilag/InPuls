name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run regression and security tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log

      - name: Run temporary official-archive cascade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-data
          for symbol in BTCUSDT ETHUSDT SOLUSDT XRPUSDT; do
            file="${symbol}-1m-2026-07.zip"
            curl --fail --location --silent --show-error \
              --retry 2 --retry-delay 2 --retry-all-errors \
              "https://data.binance.vision/data/futures/um/monthly/klines/${symbol}/1m/${file}" \
              --output "archive-data/${file}"
            unzip -p "archive-data/${file}" > "archive-data/${symbol}.csv"
          done
          node algo-archive-backtest.mjs \
            --strategy cascade \
            --days 7 \
            --inputs BTCUSDT=archive-data/BTCUSDT.csv,ETHUSDT=archive-data/ETHUSDT.csv,SOLUSDT=archive-data/SOLUSDT.csv,XRPUSDT=archive-data/XRPUSDT.csv \
            | tee cascade-baseline.json

      - name: Preserve regression output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-test-log-${{ github.run_id }}
          path: npm-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Preserve cascade baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cascade-baseline-${{ github.run_id }}
          path: cascade-baseline.json
          if-no-files-found: warn
          retention-days: 7
