<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self'; connect-src 'self'" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Обновление InPuls</title>
    <style>
      html,body{height:100%;margin:0;background:#080711;color:#eee8f6;font:14px Inter,system-ui,sans-serif}body{display:grid;place-items:center}.box{width:min(420px,calc(100% - 32px));text-align:center}.pulse{width:12px;height:12px;margin:0 auto 14px;border-radius:50%;background:#37e6a1;box-shadow:0 0 24px #37e6a1;animation:p 1s infinite alternate}@keyframes p{to{opacity:.35}}p,small{display:block;margin:8px 0;color:#9d8bad;line-height:1.5}button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:#37e6a1;color:#04110d;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    </style>
  </head>
  <body>
    <div class="box">
      <div class="pulse"></div>
      <strong>Безопасное обновление InPuls</strong>
      <p>Будут удалены только Service Worker и кеши InPuls. Другие приложения на этом домене не затрагиваются.</p>
      <button id="refresh" type="button">Очистить и открыть InPuls</button>
      <small id="status"></small>
    </div>
    <script type="module" src="./refresh.js?v=26-41-book-visuals-v1"></script>
  </body>
</html>
